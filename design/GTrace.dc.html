<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>traceroute</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «traceroute»: крупное время в терминале, хопы-города маршрута появляются по одному с задержками, мигающий курсор, живой пинг в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="tc-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="tc-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="tc-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#tc-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor" font-family="VT323, monospace" font-size="12">
<text x="36" y="36">{{date}}</text>
<text x="20" y="80" font-size="46" textLength="92" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<text x="20" y="97">$ traceroute home</text>
<text x="32" y="110" opacity="{{o0}}">1 ZAG</text>
<text x="124" y="110" text-anchor="end" opacity="{{o0}}">{{r0}}</text>
<text x="32" y="121" opacity="{{o1}}">2 BEG</text>
<text x="124" y="121" text-anchor="end" opacity="{{o1}}">{{r1}}</text>
<text x="32" y="132" opacity="{{o2}}">3 EVN</text>
<text x="124" y="132" text-anchor="end" opacity="{{o2}}">{{r2}}</text>
<text x="32" y="143" opacity="{{o3}}">4 TBS</text>
<text x="124" y="143" text-anchor="end" opacity="{{o3}}">{{r3}}</text>
<text x="32" y="154" opacity="{{o4}}">5 TAS *</text>
<text x="124" y="154" text-anchor="end" opacity="{{o4}}">{{r4}}</text>
</g>
<rect x="32" y="{{cy}}" width="5" height="9" fill="currentColor" opacity="{{cop}}"></rect>
<rect width="176" height="176" fill="url(#tc-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#tc-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">RTT</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{ping}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">MS</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#tc-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 150);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const mons = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    const cyc = Math.floor(t / 7);
    if (this.cyc !== cyc || !this.rtts) {
      this.cyc = cyc;
      const base = [3, 11, 38, 14, 62];
      this.rtts = base.map((b) => (b + Math.random() * 8).toFixed(1) + 'ms');
    }
    const phase = Math.floor((t % 7) / 0.7);
    const k = Math.min(phase, 5);
    const rowY = [110, 121, 132, 143, 154];
    const blink = Math.floor(t * 2) % 2 === 0;
    const op = (i) => (i < k ? 1 : 0);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      o0: op(0), o1: op(1), o2: op(2), o3: op(3), o4: op(4),
      r0: this.rtts[0], r1: this.rtts[1], r2: this.rtts[2], r3: this.rtts[3], r4: this.rtts[4],
      cy: k < 5 ? rowY[k] - 8 : 0,
      cop: k < 5 && blink ? 1 : 0,
      ping: String(Math.round(60 + 10 * Math.sin(t * 3) + Math.random() * 4))
    };
  }
}
</script>
</body>
</html>
