<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Японский на запястье</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Японский на запястье»: каждый час новое слово — крупный кандзи пиксельным шрифтом, затем чтение каной, затем ромадзи и перевод; токийское время в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="jp-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="jp-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="jp-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#jp-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor">
<text x="30" y="44" font-family="'Jersey 10', monospace" font-size="24" textLength="46" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<text x="30" y="58" font-family="Silkscreen, monospace" font-size="8">{{counter}}</text>
<text x="80" y="122" text-anchor="middle" font-family="DotGothic16, monospace" font-size="52">{{kanji}}</text>
<text x="88" y="142" text-anchor="middle" font-family="DotGothic16, monospace" font-size="14" opacity="{{kanaOp}}">{{kana}}</text>
<text x="88" y="158" text-anchor="middle" font-family="DotGothic16, monospace" font-size="12" opacity="{{transOp}}">{{trans}}</text>
</g>
<rect x="44" y="128" width="88" height="1" fill="currentColor" opacity="{{kanaOp}}"></rect>
<rect width="176" height="176" fill="url(#jp-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#jp-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">TYO</text>
<text x="144" y="42" font-family="'Jersey 10', monospace" font-size="22" textLength="40" lengthAdjust="spacingAndGlyphs">{{tyo}}</text>
<text x="144" y="56" font-family="DotGothic16, monospace" font-size="10">東京</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#jp-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 150);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const words = [
      ['時計', 'とけい', 'tokei / часы'],
      ['旅', 'たび', 'tabi / путешествие'],
      ['駅', 'えき', 'eki / станция'],
      ['電車', 'でんしゃ', 'densha / электричка'],
      ['切符', 'きっぷ', 'kippu / билет'],
      ['宿', 'やど', 'yado / ночлег'],
      ['山', 'やま', 'yama / гора'],
      ['海', 'うみ', 'umi / море'],
      ['空', 'そら', 'sora / небо'],
      ['雨', 'あめ', 'ame / дождь'],
      ['雪', 'ゆき', 'yuki / снег'],
      ['風', 'かぜ', 'kaze / ветер'],
      ['月', 'つき', 'tsuki / луна'],
      ['星', 'ほし', 'hoshi / звезда'],
      ['朝', 'あさ', 'asa / утро'],
      ['夜', 'よる', 'yoru / ночь'],
      ['道', 'みち', 'michi / дорога'],
      ['茶', 'ちゃ', 'cha / чай'],
      ['水', 'みず', 'mizu / вода'],
      ['猫', 'ねこ', 'neko / кошка'],
      ['花', 'はな', 'hana / цветок'],
      ['橋', 'はし', 'hashi / мост'],
      ['町', 'まち', 'machi / городок'],
      ['地図', 'ちず', 'chizu / карта']
    ];
    let idx;
    let phase;
    if (demo) {
      idx = Math.floor(nowMs / 4000) % 24;
      phase = nowMs % 4000;
    } else {
      idx = now.getHours();
      phase = 99999;
    }
    const w = words[idx];
    const tyoH = (now.getUTCHours() + 9) % 24;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      counter: 'WORD ' + (idx + 1) + '/24',
      kanji: w[0],
      kana: w[1],
      trans: w[2],
      kanaOp: phase > 1200 ? 1 : 0,
      transOp: phase > 2200 ? 1 : 0,
      tyo: p2(tyoH) + ':' + p2(now.getUTCMinutes())
    };
  }
}
</script>
</body>
</html>
