<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перфокарта BCD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Перфокарта»: часы, минуты и секунды в двоично-десятичном коде пробиты на карте, выбитые кусочки падают, расшифровка снизу, секунды в двоичном виде в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="pc-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="pc-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="pc-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#pc-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8">
<text x="30" y="52">TIME CARD</text>
<text x="30" y="64">{{date}}</text>
</g>
<polygon points="34.5,72.5 152.5,72.5 152.5,140.5 24.5,140.5 24.5,82.5" fill="{{bg}}" stroke="currentColor" stroke-width="1"></polygon>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8">
<text x="29" y="91">8</text>
<text x="29" y="104">4</text>
<text x="29" y="117">2</text>
<text x="29" y="130">1</text>
</g>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="51" y="139">H</text>
<text x="87" y="139">M</text>
<text x="123" y="139">S</text>
</g>
<path d="M69.5 80V134M105.5 80V134" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 2"></path>
<path d="{{empty}}" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 1"></path>
<path d="{{punched}}" fill="currentColor"></path>
<path d="{{chads}}" fill="currentColor"></path>
<text x="88" y="162" text-anchor="middle" fill="currentColor" font-family="'Jersey 10', monospace" font-size="26" textLength="72" lengthAdjust="spacingAndGlyphs">{{hms}}</text>
<rect width="176" height="176" fill="url(#pc-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#pc-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<text x="144" y="20" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">SEC</text>
<path d="{{subE}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<path d="{{subP}}" fill="currentColor"></path>
<text x="144" y="52" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{ss}}</text>
<rect x="113" y="1" width="62" height="62" fill="url(#pc-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const hh = now.getHours();
    const mm = now.getMinutes();
    const ss = now.getSeconds();
    const digits = [Math.floor(hh / 10), hh % 10, Math.floor(mm / 10), mm % 10, Math.floor(ss / 10), ss % 10];
    const colX = [40, 54, 76, 90, 112, 126];
    const rowY = [84, 97, 110, 123];
    const bits = [8, 4, 2, 1];
    const valid = [[0, 0, 1, 1], [1, 1, 1, 1], [0, 1, 1, 1], [1, 1, 1, 1], [0, 1, 1, 1], [1, 1, 1, 1]];
    if (!this.pt) this.pt = {};
    let punched = '';
    let empty = '';
    let chads = '';
    for (let c = 0; c < 6; c++) {
      for (let r = 0; r < 4; r++) {
        if (!valid[c][r]) continue;
        const x = colX[c];
        const y = rowY[r];
        const key = c * 4 + r;
        const on = (digits[c] & bits[r]) !== 0;
        if (on) {
          if (this.pt[key] === undefined) this.pt[key] = this.inited ? nowMs : 0;
          punched += 'M' + x + ' ' + y + 'h8v9h-8z';
          const age = (nowMs - this.pt[key]) / 1000;
          if (age < 0.6) {
            const fall = 10 + 120 * age * age;
            chads += 'M' + (x + 2) + ' ' + (y + fall).toFixed(1) + 'h4v4h-4z';
          }
        } else {
          delete this.pt[key];
          empty += 'M' + (x + 0.5) + ' ' + (y + 0.5) + 'h7v8h-7z';
        }
      }
    }
    this.inited = true;
    let subP = '';
    let subE = '';
    const sb = [32, 16, 8, 4, 2, 1];
    for (let i = 0; i < 6; i++) {
      const x = 126 + i * 6;
      if (ss & sb[i]) subP += 'M' + x + ' 30h5v6h-5z';
      else subE += 'M' + (x + 0.5) + ' 30.5h4v5h-4z';
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      punched: punched || 'M0 0',
      empty: empty || 'M0 0',
      chads: chads || 'M0 0',
      hms: p2(hh) + ':' + p2(mm) + ':' + p2(ss),
      subP: subP || 'M0 0',
      subE: subE || 'M0 0',
      ss: p2(ss)
    };
  }
}
</script>
</body>
</html>
