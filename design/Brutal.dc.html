<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Брутал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Брутал»: огромные часы инверсией на чёрном блоке, минуты под ним, пульс и заряд слева, секунды в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="b-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="b-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="b-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#b-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<rect x="0" y="0" width="176" height="90" fill="currentColor"></rect>
<text x="26" y="84" fill="{{bg}}" font-family="'Jersey 10', monospace" font-size="76" textLength="80" lengthAdjust="spacingAndGlyphs">14</text>
<g fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8" font-weight="700">
<text x="114" y="77">FRI</text>
<text x="114" y="87">06.11</text>
</g>
<text x="54" y="157" fill="currentColor" font-family="'Jersey 10', monospace" font-size="76" textLength="82" lengthAdjust="spacingAndGlyphs">32</text>
<g fill="currentColor">
<rect x="27" y="106" width="2" height="1"></rect>
<rect x="30" y="106" width="2" height="1"></rect>
<rect x="26" y="107" width="7" height="2"></rect>

<rect x="29" y="111" width="1" height="1"></rect>
<rect x="28" y="130" width="3" height="3"></rect>
<rect x="29" y="128" width="1" height="1"></rect>
<rect x="29" y="134" width="1" height="1"></rect>
<rect x="26" y="131" width="1" height="1"></rect>
<rect x="32" y="131" width="1" height="1"></rect>
<rect x="27" y="129" width="1" height="1"></rect>
<rect x="31" y="129" width="1" height="1"></rect>
<rect x="27" y="133" width="1" height="1"></rect>
<rect x="31" y="133" width="1" height="1"></rect>
</g>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8">
<text x="26" y="122">62</text>
<text x="26" y="145">23D</text>
</g>
<rect width="176" height="176" fill="url(#b-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#b-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="45" font-family="'Jersey 10', monospace" font-size="36" textLength="30" lengthAdjust="spacingAndGlyphs">47</text>
<text x="144" y="57" font-family="Silkscreen, monospace" font-size="8">SEC</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#b-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29'
    };
  }
}
</script>
</body>
</html>
