<!doctype html>
<html lang="ru">

<path d="M8 52 Q34 66 38 88 T40 132 T30 176" fill="none" stroke="{{bg}}" stroke-width="2"></path>
<path d="M24 120 Q46 100 66 112 T100 112" fill="none" stroke="{{bg}}" stroke-width="3"></path>
<path d="M24 120 Q46 100 66 112 T100 112" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 2"></path>
<g stroke="{{bg}}" stroke-width="3">
<line x1="100" y1="103" x2="100" y2="106"></line>

<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>

<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26" textLength="34" lengthAdjust="spacingAndGlyphs">455</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">M</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#tp-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29'
    };
  }
}
</script>
</body>
</html>
