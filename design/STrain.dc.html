<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Окно поезда</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Окно поезда»: за окном с параллаксом проплывают дальние горы, холмы, столбы с провисающими проводами и шпалы; каденс шагов внизу, пройденное расстояние в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="tr-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="tr-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<clipPath id="tr-win"><rect x="18" y="70" width="140" height="66" rx="8"></rect></clipPath>
<pattern id="tr-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="tr-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="tr-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="tr-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#tr-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor">
<text x="30" y="32" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<text x="30" y="60" font-family="'Jersey 10', monospace" font-size="30" textLength="56" lengthAdjust="spacingAndGlyphs">{{time}}</text>
</g>
<g clip-path="url(#tr-win)">
<rect x="18" y="70" width="140" height="66" fill="{{bg}}"></rect>
<rect x="18" y="70" width="140" height="9" fill="url(#tr-d12)"></rect>
<path d="{{far}}" fill="url(#tr-d25)"></path>
<path d="{{near}}" fill="{{bg}}"></path>
<path d="{{near}}" fill="url(#tr-d50)"></path>
<path d="{{wires}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<path d="{{poles}}" fill="currentColor"></path>
<rect x="18" y="128" width="140" height="8" fill="currentColor"></rect>
<path d="{{ties}}" fill="{{bg}}"></path>
</g>
<rect x="18" y="70" width="140" height="66" rx="8" fill="none" stroke="currentColor" stroke-width="3"></rect>
<rect x="14" y="138" width="148" height="4" fill="currentColor"></rect>
<text x="88" y="156" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{spm}}</text>
<rect width="176" height="176" fill="url(#tr-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#tr-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">DIST</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{dist}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">KM</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#tr-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const o1 = (t * 5) % 80;
    const o2 = (t * 16) % 60;
    const o3 = (t * 40) % 46;
    const o4 = (t * 60) % 12;
    let far = '';
    for (let k = -1; k < 3; k++) {
      const bx = 18 - o1 + 80 * k;
      far += 'M' + f(bx) + ' 136L' + f(bx) + ' 112L' + f(bx + 20) + ' 96L' + f(bx + 34) + ' 104L' + f(bx + 52) + ' 90L' + f(bx + 80) + ' 112L' + f(bx + 80) + ' 136Z';
    }
    let near = '';
    for (let k = -1; k < 4; k++) {
      const bx = 18 - o2 + 60 * k;
      near += 'M' + f(bx) + ' 136L' + f(bx) + ' 120Q' + f(bx + 30) + ' 106 ' + f(bx + 60) + ' 120L' + f(bx + 60) + ' 136Z';
    }
    let poles = '';
    let wires = '';
    for (let k = -1; k < 5; k++) {
      const px = 18 - o3 + 46 * k;
      poles += 'M' + f(px) + ' 82h2v46h-2z' + 'M' + f(px - 3) + ' 84h8v1h-8z';
      wires += 'M' + f(px + 1) + ' 85Q' + f(px + 24) + ' 93 ' + f(px + 47) + ' 85';
    }
    let ties = '';
    for (let k = -1; k < 13; k++) {
      const x = 18 - o4 + 12 * k;
      ties += 'M' + f(x) + ' 131h6v1h-6z';
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      far: far,
      near: near,
      poles: poles,
      wires: wires,
      ties: ties,
      spm: 'CADENCE ' + (116 + Math.round(4 * Math.sin(t / 2))) + ' SPM',
      dist: (5 + (t % 600) / 100).toFixed(1)
    };
  }
}
</script>
</body>
</html>
