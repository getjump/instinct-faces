<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Скайлайн недели</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Скайлайн недели»: семь домов — шаги за семь дней, дома выше цели с флажками, сегодняшний дом растёт, окна мигают, шаги за сегодня в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="sk-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="sk-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="sk-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="sk-win" x="18" y="140" width="5" height="6" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="2" height="3" fill="{{bg}}"></rect></pattern>
<pattern id="sk-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#sk-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<rect x="0" y="140" width="176" height="36" fill="url(#sk-d12)"></rect>
<text x="26" y="52" fill="currentColor" font-family="'Jersey 10', monospace" font-size="28" textLength="54" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<path d="M18 86H158" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"></path>
<text x="20" y="83" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">10K</text>
<path d="{{bld}}" fill="currentColor"></path>
<path d="{{wins}}" fill="url(#sk-win)"></path>
<path d="{{dark}}" fill="currentColor"></path>
<path d="{{flags}}" fill="currentColor"></path>
<rect x="{{bx}}" y="{{by}}" width="2" height="2" fill="currentColor" opacity="{{beacon}}"></rect>
<rect x="0" y="140" width="176" height="1" fill="currentColor"></rect>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="26" y="151">{{d0}}</text>
<text x="46" y="151">{{d1}}</text>
<text x="66" y="151">{{d2}}</text>
<text x="86" y="151">{{d3}}</text>
<text x="106" y="151">{{d4}}</text>
<text x="126" y="151">{{d5}}</text>
<text x="146" y="151">{{d6}}</text>
</g>
<rect x="140" y="153" width="12" height="1" fill="currentColor"></rect>
<rect width="176" height="176" fill="url(#sk-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#sk-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">TODAY</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="22">{{steps}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{pct}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#sk-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 120);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const todayTarget = 8412;
    const today = demo ? Math.round(todayTarget * Math.min(1, (nowMs % 10000) / 8000)) : todayTarget;
    const steps = [9200, 11040, 6400, 12800, 7900, 10300, today];
    const k = 70 / 13000;
    let bld = '';
    let wins = '';
    let flags = '';
    let dark2 = '';
    const seed = Math.floor(t / 0.6);
    let topX = 0;
    let topY = 140;
    for (let i = 0; i < 7; i++) {
      const x = 18 + i * 20;
      const h = Math.max(2, Math.round(steps[i] * k));
      const y = 140 - h;
      bld += 'M' + x + ' ' + y + 'h16v' + h + 'h-16z';
      if (h > 6) wins += 'M' + x + ' ' + (y + 3) + 'h15v' + (h - 4) + 'h-15z';
      if (steps[i] >= 10000) flags += 'M' + (x + 8) + ' ' + (y - 9) + 'h1v9h-1z' + 'M' + (x + 9) + ' ' + (y - 9) + 'l5 2l-5 2z';
      for (let j = 0; j < 2; j++) {
        const hsh = Math.imul((seed * 7 + i * 13 + j * 31) ^ 0x5bd1e995, 2654435761) >>> 0;
        const col = hsh % 3;
        const rows = Math.max(1, Math.floor((h - 4) / 6));
        const row = (hsh >>> 8) % rows;
        if (h > 10) dark2 += 'M' + (x + 1 + col * 5) + ' ' + (140 - 6 * (row + 1) + 1) + 'h2v3h-2z';
      }
      if (i === 6) {
        topX = x + 7;
        topY = y - 3;
      }
    }
    const labels = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(nowMs - (6 - i) * 86400000);
      labels.push(letters[d.getDay()]);
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      bld: bld,
      wins: wins || 'M0 0',
      dark: dark2 || 'M0 0',
      flags: flags || 'M0 0',
      bx: topX,
      by: topY,
      beacon: Math.floor(t * 2) % 2 === 0 ? 1 : 0,
      d0: labels[0], d1: labels[1], d2: labels[2], d3: labels[3], d4: labels[4], d5: labels[5], d6: labels[6],
      steps: String(today),
      pct: Math.round((today / 10000) * 100) + '%'
    };
  }
}
</script>
</body>
</html>
