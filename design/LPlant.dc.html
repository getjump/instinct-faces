<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Растение на солнце</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Растение на солнце»: солнце идёт по дуге, росток в горшке растёт от собранного за день света и качается, вечером зацветает, ночью небо темнеет">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="pl-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="pl-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="pl-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="pl-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="pl-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#pl-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<rect width="176" height="158" fill="{{skyFill}}"></rect>
<circle cx="{{sunX}}" cy="{{sunY}}" r="{{sunR}}" fill="currentColor"></circle>
<path d="{{rays}}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"></path>
<g fill="currentColor" font-family="'Jersey 10', monospace" font-size="38">
<text x="24" y="100" textLength="36" lengthAdjust="spacingAndGlyphs">{{hh}}</text>
<text x="24" y="132" textLength="36" lengthAdjust="spacingAndGlyphs">{{mm}}</text>
</g>
<text x="24" y="146" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{day}}</text>
<rect x="0" y="158" width="176" height="18" fill="{{bg}}"></rect>
<rect x="0" y="158" width="176" height="18" fill="url(#pl-d50)"></rect>
<rect x="0" y="157" width="176" height="1" fill="currentColor"></rect>
<path d="{{stem}}" fill="none" stroke="currentColor" stroke-width="2"></path>
<path d="{{leaves}}" fill="currentColor"></path>
<circle cx="{{fx}}" cy="{{fy}}" r="{{fr}}" fill="{{bg}}"></circle>
<circle cx="{{fx}}" cy="{{fy}}" r="{{fr}}" fill="url(#pl-d50)" stroke="currentColor" stroke-width="1"></circle>
<circle cx="{{fx}}" cy="{{fy}}" r="{{fc}}" fill="currentColor"></circle>
<rect x="78" y="134" width="44" height="5" fill="currentColor"></rect>
<polygon points="82,139 118,139 113,157 87,157" fill="currentColor"></polygon>
<text x="100" y="151" text-anchor="middle" fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8">{{grow}}</text>
<rect width="176" height="176" fill="url(#pl-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#pl-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">SOLAR</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="24">{{sol}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{phase}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#pl-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 120);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    let p;
    if (demo) {
      p = (nowMs % 30000) / 30000;
    } else {
      const h = now.getHours() + now.getMinutes() / 60;
      if (h >= 7 && h < 17) {
        p = ((h - 7) / 10) * 0.8;
      } else {
        const hn = h >= 17 ? h - 17 : h + 7;
        p = 0.8 + (hn / 14) * 0.2;
      }
    }
    const day = p < 0.8;
    const q = day ? p / 0.8 : 1;
    const g = day ? Math.min(1, q * 1.15) : 1;
    let hh;
    let mm;
    if (demo) {
      const hours = (day ? 7 + q * 10 : 17 + ((p - 0.8) / 0.2) * 14) % 24;
      hh = Math.floor(hours);
      mm = Math.floor((hours - hh) * 60);
    } else {
      hh = now.getHours();
      mm = now.getMinutes();
    }
    const sunVis = day && q > 0.05 && q < 0.95;
    const sx = 26 + 66 * q;
    const sy = 70 - 46 * Math.sin(Math.PI * q);
    let rays = '';
    if (sunVis) {
      for (let k = 0; k < 8; k++) {
        const a = t * 0.8 + (k * Math.PI) / 4;
        rays += 'M' + f(sx + 9 * Math.cos(a)) + ' ' + f(sy + 9 * Math.sin(a)) + 'L' + f(sx + 12 * Math.cos(a)) + ' ' + f(sy + 12 * Math.sin(a));
      }
    }
    const H = 18 + 74 * g;
    const s = Math.sin(t * 1.7) * 2.5 * g;
    const topX = 100 + s * 1.6;
    const topY = 134 - H;
    const stem = 'M100 134Q' + f(100 + s) + ' ' + f(134 - H / 2) + ' ' + f(topX) + ' ' + f(topY);
    const fs = [0.22, 0.42, 0.6, 0.76];
    const th = [0.12, 0.3, 0.48, 0.64];
    const sd = [-1, 1, -1, 1];
    let leaves = '';
    for (let i = 0; i < 4; i++) {
      const k = Math.max(0, Math.min(1, (g - th[i]) / 0.18));
      const L = 16 * k;
      if (L < 1) continue;
      const bx = 100 + s * 1.6 * fs[i] * fs[i];
      const by = 134 - H * fs[i];
      const w = Math.sin(t * 1.7 + i) * 1.2 * k;
      const side = sd[i];
      leaves += 'M' + f(bx) + ' ' + f(by) +
        'Q' + f(bx + side * L * 0.45) + ' ' + f(by - L * 0.55 + w) + ' ' + f(bx + side * L) + ' ' + f(by - L * 0.25 + w) +
        'Q' + f(bx + side * L * 0.55) + ' ' + f(by + L * 0.12 + w) + ' ' + f(bx) + ' ' + f(by) + 'Z';
    }
    const fr = g >= 0.9 ? 3 + 5 * Math.min(1, (g - 0.9) / 0.08) : 0;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      skyFill: day ? 'none' : 'url(#pl-d25)',
      sunX: f(sx),
      sunY: f(sy),
      sunR: sunVis ? 6 : 0,
      rays: rays || 'M0 0',
      hh: p2(hh),
      mm: p2(mm),
      day: days[now.getDay()] + ' ' + p2(now.getDate()),
      stem: stem,
      leaves: leaves || 'M0 0',
      fx: f(topX),
      fy: f(topY),
      fr: f(fr),
      fc: fr > 0 ? 2.5 : 0,
      grow: Math.round(g * 100) + '%',
      sol: (sunVis ? Math.round(100 * Math.sin(Math.PI * q)) : 0) + '%',
      phase: day ? 'DAY' : 'NIGHT'
    };
  }
}
</script>
</body>
</html>
