<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Числа майя</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Числа майя»: часы и минуты записаны двадцатеричными числами майя из точек, черт и знака-раковины для нуля в два уровня, расшифровка цифрами внизу; секунды тоже числом майя в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="my-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="my-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="my-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="my-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#my-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="30" y="44" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">BASE 20</text>
<rect x="25.5" y="55.5" width="36" height="72" fill="url(#my-d12)" stroke="currentColor" stroke-width="1"></rect>
<rect x="75.5" y="55.5" width="36" height="72" fill="url(#my-d12)" stroke="currentColor" stroke-width="1"></rect>
<rect x="28" y="58" width="31" height="31" fill="{{bg}}"></rect><rect x="28" y="94" width="31" height="31" fill="{{bg}}"></rect>
<rect x="78" y="58" width="31" height="31" fill="{{bg}}"></rect><rect x="78" y="94" width="31" height="31" fill="{{bg}}"></rect>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8">
<text x="118" y="77">×20</text>
<text x="118" y="113">×1</text>
</g>
<g opacity="{{hOp}}">
<path d="{{hFill}}" fill="currentColor"></path>
<path d="{{hStroke}}" fill="none" stroke="currentColor" stroke-width="1.5"></path>
</g>
<g opacity="{{mOp}}">
<path d="{{mFill}}" fill="currentColor"></path>
<path d="{{mStroke}}" fill="none" stroke="currentColor" stroke-width="1.5"></path>
</g>
<g fill="currentColor">
<rect x="67" y="84" width="3" height="3"></rect>
<rect x="67" y="96" width="3" height="3"></rect>
</g>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="43.5" y="138">HRS</text>
<text x="93.5" y="138">MIN</text>
</g>
<text x="88" y="158" text-anchor="middle" fill="currentColor" font-family="'Jersey 10', monospace" font-size="22">{{time}}</text>
<rect width="176" height="176" fill="url(#my-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#my-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g transform="translate(136.5 10) scale(0.5)">
<path d="{{sFill}}" fill="currentColor"></path>
<path d="{{sStroke}}" fill="none" stroke="currentColor" stroke-width="2.5"></path>
</g>
<text x="144" y="58" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">SEC</text>
<rect x="113" y="1" width="62" height="62" fill="url(#my-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  glyph(n, bx, by) {
    const f = (v) => v.toFixed(1);
    let fill = '';
    let stroke = '';
    if (n === 0) {
      const cy = by + 20;
      stroke += 'M' + f(bx + 4.5) + ' ' + f(cy) + 'a11 6 0 1 0 22 0a11 6 0 1 0 -22 0Z';
      stroke += 'M' + f(bx + 9.5) + ' ' + f(cy - 1.5) + 'Q' + f(bx + 15.5) + ' ' + f(cy + 2) + ' ' + f(bx + 21.5) + ' ' + f(cy - 1.5);
      return [fill, stroke];
    }
    const bars = Math.floor(n / 5);
    const dots = n % 5;
    for (let i = 0; i < bars; i++) {
      const y = by + 31 - 4 - i * 7 - 4.5;
      fill += 'M' + f(bx + 2.5) + ' ' + f(y) + 'h26v4.5h-26z';
    }
    if (dots > 0) {
      const cy = by + 31 - 4 - bars * 7 - 3.5;
      const total = (dots - 1) * 6.5;
      const sx = bx + 15.5 - total / 2;
      for (let i = 0; i < dots; i++) {
        const cx = sx + i * 6.5;
        fill += 'M' + f(cx - 2.4) + ' ' + f(cy) + 'a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0Z';
      }
    }
    return [fill, stroke];
  }
  number(v, bx, upperY, lowerY) {
    const hi = Math.floor(v / 20);
    const lo = v % 20;
    let fill = '';
    let stroke = '';
    if (hi > 0) {
      const g = this.glyph(hi, bx, upperY);
      fill += g[0];
      stroke += g[1];
    }
    const g2 = this.glyph(lo, bx, lowerY);
    fill += g2[0];
    stroke += g2[1];
    return [fill || 'M0 0', stroke || 'M0 0'];
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const hour = now.getHours();
    const minute = demo ? Math.floor(nowMs / 1500) % 60 : now.getMinutes();
    const sec = now.getSeconds();
    if (this.lastH !== hour) {
      this.lastH = hour;
      this.hAt = nowMs;
    }
    if (this.lastM !== minute) {
      this.lastM = minute;
      this.mAt = nowMs;
    }
    const blink = (at) => {
      const e = nowMs - (at || 0);
      return e < 600 && Math.floor(e / 100) % 2 === 1 ? 0 : 1;
    };
    const h = this.number(hour, 28, 58, 94);
    const m = this.number(minute, 78, 58, 94);
    const s = this.number(sec, 0, 0, 36);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      hFill: h[0],
      hStroke: h[1],
      mFill: m[0],
      mStroke: m[1],
      hOp: blink(this.hAt),
      mOp: blink(this.mAt),
      sFill: s[0],
      sStroke: s[1],
      time: p2(hour) + ':' + p2(minute)
    };
  }
}
</script>
</body>
</html>
