<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аквариум</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Аквариум»: пять 1-битных рыб плавают и разворачиваются, колышутся водоросли, поднимаются пузырьки, поверхность воды волнуется, число рыб — дни подряд с выполненной целью, в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="aq-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="aq-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="aq-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="aq-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="aq-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#aq-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor">
<text x="34" y="30" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<text x="24" y="56" font-family="'Jersey 10', monospace" font-size="30" textLength="56" lengthAdjust="spacingAndGlyphs">{{time}}</text>
</g>
<path d="{{water}}" fill="url(#aq-d12)"></path>
<path d="{{surface}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<path d="{{weed}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
<path d="M0 150 Q20 144 40 150 T80 150 T120 150 T160 150 T200 150 V176 H0 Z" fill="{{bg}}"></path>
<path d="M0 150 Q20 144 40 150 T80 150 T120 150 T160 150 T200 150 V176 H0 Z" fill="url(#aq-d50)" stroke="currentColor" stroke-width="1"></path>
<path d="{{bubbles}}" fill="{{bg}}" stroke="currentColor" stroke-width="0.8"></path>
<path d="{{fish}}" fill="currentColor"></path>
<path d="{{eyes}}" fill="{{bg}}"></path>
<rect width="176" height="176" fill="url(#aq-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#aq-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">FISH</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">5</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">DAYS</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#aq-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 70);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    let surface = '';
    for (let x = 0; x <= 176; x += 4) {
      const y = 62 + 1.5 * Math.sin(x / 9 + t * 1.5);
      surface += (x ? 'L' : 'M') + x + ' ' + f(y);
    }
    const water = surface + 'L176 176L0 176Z';
    let weed = '';
    const wx = [36, 58, 124, 140];
    for (let k = 0; k < wx.length; k++) {
      const x = wx[k];
      const s1 = 4 * Math.sin(t * 1.2 + k);
      const s2 = 5 * Math.sin(t * 1.2 + k + 0.8);
      const top = k % 2 ? 104 : 96;
      weed += 'M' + x + ' 150Q' + f(x + s1) + ' 135 ' + x + ' 122Q' + f(x - s1) + ' 110 ' + f(x + s2) + ' ' + top;
    }
    let fish = '';
    let eyes = '';
    for (let i = 0; i < 5; i++) {
      const sp = 0.25 + i * 0.06;
      const ph = i * 1.3;
      const xx = 85 + 55 * Math.sin(t * sp + ph);
      const dir = Math.cos(t * sp + ph) > 0 ? 1 : -1;
      const yy = 80 + i * 12 + 3 * Math.sin(t * 1.3 + i);
      fish += 'M' + f(xx - 6) + ' ' + f(yy) + 'a6 3.5 0 1 0 12 0a6 3.5 0 1 0 -12 0Z';
      fish += 'M' + f(xx - dir * 5) + ' ' + f(yy) + 'L' + f(xx - dir * 11) + ' ' + f(yy - 4) + 'L' + f(xx - dir * 11) + ' ' + f(yy + 4) + 'Z';
      eyes += 'M' + Math.round(xx + dir * 3) + ' ' + Math.round(yy - 1.5) + 'h1v1h-1z';
    }
    let bubbles = '';
    for (let i = 0; i < 8; i++) {
      const x = 40 + i * 13 + 2 * Math.sin(t * 2 + i);
      const y = 146 - ((t * 12 + i * 17) % 84);
      bubbles += 'M' + f(x - 1.5) + ' ' + f(y) + 'a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0Z';
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      water: water,
      surface: surface,
      weed: weed,
      fish: fish,
      eyes: eyes,
      bubbles: bubbles
    };
  }
}
</script>
</body>
</html>
