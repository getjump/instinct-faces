<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прогулка по карте</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Прогулка по карте»: ASCII-подземелье, герой @ идёт к лестнице по мере шагов и оставляет след, стрелка к цели в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="mw-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="mw-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="mw-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#mw-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor">
<text x="32" y="36" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<text x="30" y="64" font-family="'Jersey 10', monospace" font-size="32" textLength="64" lengthAdjust="spacingAndGlyphs">{{time}}</text>
</g>
<rect x="25.5" y="72.5" width="125" height="75" fill="{{bg}}" stroke="currentColor" stroke-width="1"></rect>
<g fill="currentColor" font-family="VT323, monospace" font-size="10">
<text x="26" y="80" textLength="124" lengthAdjust="spacingAndGlyphs">{{r0}}</text>
<text x="26" y="88" textLength="124" lengthAdjust="spacingAndGlyphs">{{r1}}</text>
<text x="26" y="96" textLength="124" lengthAdjust="spacingAndGlyphs">{{r2}}</text>
<text x="26" y="104" textLength="124" lengthAdjust="spacingAndGlyphs">{{r3}}</text>
<text x="26" y="112" textLength="124" lengthAdjust="spacingAndGlyphs">{{r4}}</text>
<text x="26" y="120" textLength="124" lengthAdjust="spacingAndGlyphs">{{r5}}</text>
<text x="26" y="128" textLength="124" lengthAdjust="spacingAndGlyphs">{{r6}}</text>
<text x="26" y="136" textLength="124" lengthAdjust="spacingAndGlyphs">{{r7}}</text>
<text x="26" y="144" textLength="124" lengthAdjust="spacingAndGlyphs">{{r8}}</text>
</g>
<text x="88" y="161" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{status}}</text>
<rect width="176" height="176" fill="url(#mw-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#mw-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<text x="144" y="15" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">GOAL</text>
<g transform="{{arrowTf}}">
<polygon points="144,24 138,41 144,37 150,41" fill="currentColor"></polygon>
</g>
<text x="144" y="56" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{left}}</text>
<rect x="113" y="1" width="62" height="62" fill="url(#mw-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 150);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const base = [
      '########################',
      '#..........#...~~~~....#',
      '#..TT......+...~~~~..>.#',
      '#..TT......#.......T...#',
      '#####+######..TT.......#',
      '#......#.......TT...####',
      '#......#....~~.........#',
      '#......+....~~...T.....#',
      '########################'
    ];
    const path = [[2, 6], [3, 6], [4, 6], [5, 6], [6, 6], [6, 7], [7, 7], [8, 7], [9, 7], [10, 7], [11, 7], [11, 6], [11, 5], [12, 5], [12, 4], [12, 3], [13, 3], [14, 3], [15, 3], [16, 3], [17, 3], [18, 3], [18, 4], [19, 4], [20, 4], [20, 3], [21, 3], [21, 2]];
    const len = path.length;
    const tick = Math.floor(t / 0.45) % (len + 8);
    const idx = Math.min(tick, len - 1);
    const grid = base.map((r) => r.split(''));
    for (let i = 0; i < idx; i++) {
      const px = path[i][0];
      const py = path[i][1];
      if (grid[py][px] === '.') grid[py][px] = ':';
    }
    const hx = path[idx][0];
    const hy = path[idx][1];
    grid[hy][hx] = '@';
    const rows = grid.map((r) => r.join(''));
    const reached = idx === len - 1;
    const steps = Math.round((10000 * idx) / (len - 1));
    const angle = reached ? 0 : (Math.atan2(2 - hy, 21 - hx) * 180) / Math.PI + 90;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      r0: rows[0], r1: rows[1], r2: rows[2], r3: rows[3], r4: rows[4],
      r5: rows[5], r6: rows[6], r7: rows[7], r8: rows[8],
      status: reached ? 'LEVEL UP!' : 'STEPS ' + steps + '/10K',
      arrowTf: 'rotate(' + angle.toFixed(1) + ' 144 33)',
      left: reached ? 'HERE' : String(len - 1 - idx)
    };
  }
}
</script>
</body>
</html>
