<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Одна стрелка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Одна стрелка»: минималистичный циферблат с единственной часовой стрелкой и 144 делениями по пять минут, время читается с точностью до пяти минут; округлённое время внизу">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="oh-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="oh-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="oh-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#oh-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="24" y="36" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">ONE HAND</text>
<path d="{{t5}}" fill="none" stroke="currentColor" stroke-width="0.8"></path>
<path d="{{t15}}" fill="none" stroke="currentColor" stroke-width="1.2"></path>
<path d="{{t60}}" fill="none" stroke="currentColor" stroke-width="2"></path>
<g fill="currentColor" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="11" text-anchor="middle">
<text x="96.5" y="74">1</text><text x="110" y="87.5">2</text><text x="115" y="106">3</text>
<text x="110" y="124.5">4</text><text x="96.5" y="138">5</text><text x="78" y="143">6</text>
<text x="59.5" y="138">7</text><text x="46" y="124.5">8</text><text x="41" y="106">9</text>
<text x="46" y="87.5">10</text><text x="59.5" y="74">11</text><text x="78" y="69">12</text>
</g>
<g transform="{{hTf}}">
<polygon points="78,46 79.6,100 79,114 77,114 76.4,100" fill="currentColor"></polygon>
</g>
<circle cx="78" cy="102" r="3.5" fill="currentColor"></circle>
<circle cx="78" cy="102" r="1.2" fill="{{bg}}"></circle>
<text x="88" y="172" text-anchor="middle" fill="currentColor" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="11">{{approx}}</text>
<rect width="176" height="176" fill="url(#oh-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#oh-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">{{dow}}</text>
<text x="144" y="44" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="22">{{dd}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">5 MIN</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#oh-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 100);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const f = (v) => v.toFixed(1);
    if (!this.ticks) {
      let t5 = '';
      let t15 = '';
      let t60 = '';
      for (let i = 0; i < 144; i++) {
        const a = (i * 2.5 * Math.PI) / 180;
        let r1 = 53;
        if (i % 12 === 0) r1 = 45;
        else if (i % 3 === 0) r1 = 50;
        const seg = 'M' + f(78 + r1 * Math.sin(a)) + ' ' + f(102 - r1 * Math.cos(a)) + 'L' + f(78 + 56 * Math.sin(a)) + ' ' + f(102 - 56 * Math.cos(a));
        if (i % 12 === 0) t60 += seg;
        else if (i % 3 === 0) t15 += seg;
        else t5 += seg;
      }
      this.ticks = [t5, t15, t60];
    }
    let h12;
    let hour24;
    if (demo) {
      h12 = (nowMs / 4000) % 12;
      hour24 = Math.floor(h12) + (now.getHours() >= 12 ? 12 : 0);
    } else {
      h12 = (now.getHours() % 12) + now.getMinutes() / 60 + now.getSeconds() / 3600;
      hour24 = now.getHours();
    }
    let mins = Math.round(((h12 % 1) * 60) / 5) * 5;
    let hh = hour24;
    if (mins === 60) {
      mins = 0;
      hh = (hh + 1) % 24;
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      t5: this.ticks[0],
      t15: this.ticks[1],
      t60: this.ticks[2],
      hTf: 'rotate(' + f(h12 * 30) + ' 78 102)',
      approx: '~ ' + hh + ':' + p2(mins),
      dow: days[now.getDay()],
      dd: p2(now.getDate())
    };
  }
}
</script>
</body>
</html>
