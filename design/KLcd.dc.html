<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ретро-ЖК</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Ретро-ЖК»: семисегментные цифры с проступающими растром неактивными сегментами, мигающее двоеточие, иконки будильника и сигнала, полоса секунд из сегментов, режимы время, дата, будильник, секундомер">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="lc-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="lc-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="lc-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="lc-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#lc-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<rect x="26" y="38" width="20" height="11" fill="currentColor"></rect>
<text x="36" y="46.5" text-anchor="middle" fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8">{{mode}}</text>
<text x="52" y="47" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{top}}</text>
<path d="{{ghost}}" fill="url(#lc-d25)"></path>
<path d="{{lit}}" fill="currentColor"></path>
<g fill="currentColor" opacity="{{colon}}">
<rect x="74" y="79" width="4" height="4"></rect>
<rect x="74" y="95" width="4" height="4"></rect>
</g>
<path d="M36 120h4v1h1v5h1v1h-8v-1h1v-5h1z M37 128h2v1h-2z" fill="{{bellFill}}"></path>
<g font-family="Silkscreen, monospace" font-size="8">
<text x="48" y="128" fill="currentColor">CH</text>
<text x="66" y="128" fill="currentColor">24H</text>
<text x="90" y="128" fill="{{solFill}}">SOL</text>
</g>
<path d="{{barOff}}" fill="url(#lc-d25)"></path>
<path d="{{barOn}}" fill="currentColor"></path>
<text x="88" y="160" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">SEG-7 SOLAR</text>
<rect width="176" height="176" fill="url(#lc-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#lc-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<path d="{{subGhost}}" fill="url(#lc-d25)"></path>
<path d="{{subLit}}" fill="currentColor"></path>
<text x="144" y="56" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{mon}}</text>
<rect x="113" y="1" width="62" height="62" fill="url(#lc-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  seg7(x, top, W, H, T, ch) {
    const f = (v) => v.toFixed(1);
    const map = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };
    const on = map[ch] === undefined ? '' : map[ch];
    const g = T * 0.6;
    const h2 = H / 2;
    const t = T / 2;
    const hz = (x0, y0, L) => 'M' + f(x0) + ' ' + f(y0) + 'L' + f(x0 + t) + ' ' + f(y0 - t) + 'L' + f(x0 + L - t) + ' ' + f(y0 - t) + 'L' + f(x0 + L) + ' ' + f(y0) + 'L' + f(x0 + L - t) + ' ' + f(y0 + t) + 'L' + f(x0 + t) + ' ' + f(y0 + t) + 'Z';
    const vt = (x0, y0, L) => 'M' + f(x0) + ' ' + f(y0) + 'L' + f(x0 + t) + ' ' + f(y0 + t) + 'L' + f(x0 + t) + ' ' + f(y0 + L - t) + 'L' + f(x0) + ' ' + f(y0 + L) + 'L' + f(x0 - t) + ' ' + f(y0 + L - t) + 'L' + f(x0 - t) + ' ' + f(y0 + t) + 'Z';
    const segs = {
      a: hz(x + g, top, W - 2 * g),
      g: hz(x + g, top + h2, W - 2 * g),
      d: hz(x + g, top + H, W - 2 * g),
      f: vt(x, top + g, h2 - 2 * g),
      e: vt(x, top + h2 + g, h2 - 2 * g),
      b: vt(x + W, top + g, h2 - 2 * g),
      c: vt(x + W, top + h2 + g, h2 - 2 * g)
    };
    let onP = '';
    let offP = '';
    const keys = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
    for (let i = 0; i < keys.length; i++) {
      if (on.indexOf(keys[i]) >= 0) onP += segs[keys[i]];
      else offP += segs[keys[i]];
    }
    return [onP, offP];
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const modes = ['TM', 'DT', 'AL', 'ST'];
    const mi = demo ? Math.floor(nowMs / 6000) % 4 : 0;
    const mode = modes[mi];
    const s = now.getSeconds();
    let big = p2(now.getHours()) + p2(now.getMinutes());
    let small = p2(s);
    let top = days[now.getDay()];
    let colonOn = s % 2 === 0;
    if (mode === 'DT') {
      big = p2(now.getMonth() + 1) + p2(now.getDate());
      small = String(now.getFullYear()).slice(2);
      colonOn = false;
    } else if (mode === 'AL') {
      big = '0700';
      small = '00';
      top = 'ALM';
      colonOn = true;
    } else if (mode === 'ST') {
      const el = nowMs % 6000;
      const sec = Math.floor(el / 1000);
      big = '00' + p2(sec);
      small = p2(Math.floor((el % 1000) / 10));
      top = 'STW';
      colonOn = true;
    }
    let lit = '';
    let ghost = '';
    const cells = [22, 48, 84, 110];
    for (let i = 0; i < 4; i++) {
      const r = this.seg7(cells[i], 68, 20, 40, 5, big[i]);
      lit += r[0];
      ghost += r[1];
    }
    const sc = [140, 152];
    for (let i = 0; i < 2; i++) {
      const r = this.seg7(sc[i], 92, 8, 16, 2.5, small[i]);
      lit += r[0];
      ghost += r[1];
    }
    let barOn = '';
    let barOff = '';
    const lim = Math.floor(s / 2) + 1;
    for (let i = 0; i < 30; i++) {
      const x = 35 + i * 3.5;
      const seg = 'M' + x.toFixed(1) + ' 138h2.5v6h-2.5z';
      if (i < lim) barOn += seg;
      else barOff += seg;
    }
    const dd = p2(now.getDate());
    let subLit = '';
    let subGhost = '';
    const sx = [133, 149];
    for (let i = 0; i < 2; i++) {
      const r = this.seg7(sx[i], 22, 10, 20, 3, dd[i]);
      subLit += r[0];
      subGhost += r[1];
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      mode: mode,
      top: top,
      lit: lit,
      ghost: ghost || 'M0 0',
      colon: colonOn ? 1 : 0,
      bellFill: mode === 'AL' || s % 10 < 5 ? 'currentColor' : 'url(#lc-d25)',
      solFill: s % 4 < 2 ? 'currentColor' : 'url(#lc-d25)',
      barOn: barOn || 'M0 0',
      barOff: barOff || 'M0 0',
      subLit: subLit || 'M0 0',
      subGhost: subGhost || 'M0 0',
      mon: mons[now.getMonth()]
    };
  }
}
</script>
</body>
</html>
