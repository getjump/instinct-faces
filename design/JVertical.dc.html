<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вертикальный кандзи и ханко</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Вертикальный кандзи»: время записано японскими числительными в два вертикальных столбца справа налево, дата столбцом слева, при смене минуты знаки проявляются по одному и ставится печать-ханко с днём недели; секунды в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="jv-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="jv-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="jv-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#jv-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<path d="M79.5 36V156M44.5 44V150" fill="none" stroke="currentColor" stroke-width="0.8"></path>
<g fill="currentColor" font-family="'Shippori Mincho', serif" font-weight="800" font-size="26" text-anchor="middle">
<text x="96" y="58" opacity="{{a0o}}">{{a0}}</text>
<text x="96" y="86" opacity="{{a1o}}">{{a1}}</text>
<text x="96" y="114" opacity="{{a2o}}">{{a2}}</text>
<text x="96" y="142" opacity="{{a3o}}">{{a3}}</text>
<text x="62" y="58" opacity="{{b0o}}">{{b0}}</text>
<text x="62" y="86" opacity="{{b1o}}">{{b1}}</text>
<text x="62" y="114" opacity="{{b2o}}">{{b2}}</text>
<text x="62" y="142" opacity="{{b3o}}">{{b3}}</text>
</g>
<g fill="currentColor" font-family="'Shippori Mincho', serif" font-weight="800" font-size="11" text-anchor="middle">
<text x="31" y="56">{{c0}}</text>
<text x="31" y="69">{{c1}}</text>
<text x="31" y="82">{{c2}}</text>
<text x="31" y="95">{{c3}}</text>
<text x="31" y="108">{{c4}}</text>
<text x="31" y="121">{{c5}}</text>
<text x="31" y="134">{{c6}}</text>
</g>
<g transform="{{sealTf}}" opacity="{{sealOp}}">
<rect x="-14" y="-14" width="28" height="28" rx="3" fill="currentColor"></rect>
<rect x="-11.5" y="-11.5" width="23" height="23" rx="2" fill="none" stroke="{{bg}}" stroke-width="1"></rect>
<g fill="{{bg}}" font-family="'Shippori Mincho', serif" font-weight="800" font-size="12" text-anchor="middle">
<text x="0" y="-1">{{seal}}</text>
<text x="0" y="11">曜</text>
</g>
</g>
<rect width="176" height="176" fill="url(#jv-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#jv-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle" font-family="'Shippori Mincho', serif" font-weight="800">
<text x="144" y="42" font-size="24">{{ss}}</text>
<text x="144" y="57" font-size="11">秒</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#jv-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  kanjiNum(n) {
    const d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (n < 10) return d[n];
    const t = Math.floor(n / 10);
    const o = n % 10;
    return (t === 1 ? '' : d[t]) + '十' + (o ? d[o] : '');
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const dayK = ['日', '月', '火', '水', '木', '金', '土'];
    const colA = (this.kanjiNum(now.getHours()) + '時').split('');
    const colB = (this.kanjiNum(now.getMinutes()) + '分').split('');
    const date = (this.kanjiNum(now.getMonth() + 1) + '月' + this.kanjiNum(now.getDate()) + '日').split('');
    const key = demo ? Math.floor(nowMs / 6000) : now.getHours() * 60 + now.getMinutes();
    if (this.key !== key) {
      this.key = key;
      this.revealAt = nowMs;
    }
    const el = nowMs - this.revealAt;
    const op = (k) => (el > k * 120 ? 1 : 0);
    const stampT = el - 1200;
    let sealOp = 0;
    let sc = 1;
    if (stampT > 0) {
      sealOp = 1;
      sc = stampT < 250 ? 1.4 - 0.4 * (stampT / 250) : 1;
    }
    const v = {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      sealTf: 'translate(128 128) rotate(-4) scale(' + sc.toFixed(3) + ')',
      sealOp: sealOp,
      seal: dayK[now.getDay()],
      ss: p2(now.getSeconds())
    };
    for (let i = 0; i < 4; i++) {
      v['a' + i] = colA[i] || '';
      v['a' + i + 'o'] = op(i);
      v['b' + i] = colB[i] || '';
      v['b' + i + 'o'] = op(4 + i);
    }
    for (let i = 0; i < 7; i++) v['c' + i] = date[i] || '';
    return v;
  }
}
</script>
</body>
</html>
