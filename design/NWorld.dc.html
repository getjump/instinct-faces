<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта мира и терминатор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Карта мира»: 1-битная карта мира, ночная сторона заштрихована растром и сдвигается вместе с солнцем, подсолнечная точка, мигающая метка «ты здесь» в Ташкенте, высота солнца над Ташкентом в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="wm-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="wm-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="wm-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="wm-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="wm-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#wm-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="30" y="46" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<path d="{{nightSea}}" fill="url(#wm-d12)"></path>
<path d="{{nightLand}}" fill="url(#wm-d50)"></path>
<path d="{{dayLand}}" fill="currentColor"></path>
<rect x="21.5" y="54.5" width="133" height="67" fill="none" stroke="currentColor" stroke-width="1"></rect>
<circle cx="{{sx}}" cy="{{sy}}" r="3.5" fill="{{bg}}" stroke="currentColor" stroke-width="1"></circle>
<path d="{{sunRays}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<circle cx="113.4" cy="72.9" r="{{hereR}}" fill="{{bg}}" stroke="currentColor" stroke-width="1"></circle>
<circle cx="113.4" cy="72.9" r="1.5" fill="currentColor"></circle>
<text x="88" y="148" text-anchor="middle" fill="currentColor" font-family="'Jersey 10', monospace" font-size="28" textLength="56" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<text x="88" y="160" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{utc}}</text>
<rect width="176" height="176" fill="url(#wm-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#wm-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">{{dayNight}}</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="24">{{alt}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">SUN ALT</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#wm-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 150);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  map() {
    if (this.rows) return this.rows;
    const runs = [
      '11.3#1.4#25.', '8.1#1.11#7.1#4.2#9.', '2.12#1.5#4.20#', '2.9#2.2#1.1#2.1#3.16#1.4#',
      '6.10#5.1#1.16#2.2#1.', '7.8#6.5#1.1#1.9#1.1#4.', '7.6#8.3#1.13#1.1#4.', '8.2#1.1#8.6#1.10#7.',
      '3.1#5.2#1.1#7.9#2.2#1.2#1.1#6.', '11.1#1.2#5.9#2.1#2.2#1.1#6.', '12.4#5.7#6.4#6.', '12.6#5.4#7.7#3.',
      '12.6#5.5#9.3#4.', '13.5#5.5#8.5#3.', '13.4#7.2#10.5#3.', '13.2#9.1#11.5#2.1#',
      '13.1#25.1#2.1#1.', '13.1#30.', '15.1#28.', '1.14#3.25#1.', '2.13#4.23#2.', '44#'
    ];
    const rows = [];
    for (let r = 0; r < runs.length; r++) {
      let s = '';
      const re = /(\d+)([.#])/g;
      let m;
      while ((m = re.exec(runs[r])) !== null) s += m[2].repeat(parseInt(m[1], 10));
      while (s.length < 44) s += '.';
      rows.push(s.slice(0, 44));
    }
    this.rows = rows;
    return rows;
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const rad = Math.PI / 180;
    const rows = this.map();
    const utcH = demo ? ((nowMs / 1000) % 48) / 2 : now.getUTCHours() + now.getUTCMinutes() / 60;
    const doy = Math.floor((nowMs - Date.UTC(now.getUTCFullYear(), 0, 1)) / 86400000) + 1;
    const decl = -23.44 * Math.cos((2 * Math.PI * (doy + 10)) / 365);
    let subLon = -15 * (utcH - 12);
    subLon = ((subLon + 540) % 360) - 180;
    const sd = Math.sin(decl * rad);
    const cd = Math.cos(decl * rad);
    let dayLand = '';
    let nightLand = '';
    let nightSea = '';
    for (let r = 0; r < 22; r++) {
      const lat = 90 - (r + 0.5) * (180 / 22);
      const sl = Math.sin(lat * rad);
      const cl = Math.cos(lat * rad);
      const y = 55 + r * 3;
      let cur = '';
      let start = 0;
      for (let c = 0; c <= 44; c++) {
        let cat = 'end';
        if (c < 44) {
          const lon = -180 + (c + 0.5) * (360 / 44);
          const cz = sl * sd + cl * cd * Math.cos((lon - subLon) * rad);
          const land = rows[r][c] === '#';
          const night = cz < 0;
          cat = land ? (night ? 'nl' : 'dl') : (night ? 'ns' : 'ds');
        }
        if (cat !== cur) {
          if (cur && cur !== 'ds') {
            const seg = 'M' + (22 + start * 3) + ' ' + y + 'h' + (c - start) * 3 + 'v3h' + -(c - start) * 3 + 'z';
            if (cur === 'dl') dayLand += seg;
            else if (cur === 'nl') nightLand += seg;
            else if (cur === 'ns') nightSea += seg;
          }
          cur = cat;
          start = c;
        }
      }
    }
    const sx = 22 + ((subLon + 180) / 360) * 132;
    const sy = 55 + ((90 - decl) / 180) * 66;
    let rays = '';
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4;
      rays += 'M' + f(sx + 5 * Math.cos(a)) + ' ' + f(sy + 5 * Math.sin(a)) + 'L' + f(sx + 7 * Math.cos(a)) + ' ' + f(sy + 7 * Math.sin(a));
    }
    const tl = 41.31 * rad;
    const czT = Math.sin(tl) * sd + Math.cos(tl) * cd * Math.cos((69.28 - subLon) * rad);
    const alt = Math.round(Math.asin(Math.max(-1, Math.min(1, czT))) / rad);
    const uh = Math.floor(utcH);
    const um = Math.floor((utcH - uh) * 60);
    const localH = (uh + 5) % 24;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      dayLand: dayLand || 'M0 0',
      nightLand: nightLand || 'M0 0',
      nightSea: nightSea || 'M0 0',
      sx: f(sx),
      sy: f(sy),
      sunRays: rays,
      hereR: Math.floor(nowMs / 500) % 2 === 0 ? 3.5 : 5,
      time: demo ? p2(localH) + ':' + p2(um) : p2(now.getHours()) + ':' + p2(now.getMinutes()),
      utc: 'UTC ' + p2(uh) + ':' + p2(um),
      dayNight: alt > 0 ? 'DAY' : 'NIGHT',
      alt: alt + '°'
    };
  }
}
</script>
</body>
</html>
