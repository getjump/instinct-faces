<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Руны футарка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&amp;family=Cormorant+Garamond:wght@700&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Руны футарка»: каждый из 24 часов — своя руна Старшего футарка на рунном камне с названием и значением, минуты вырезаются насечками-счётом на двух палочках, время цифрами справа; секунды в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="rk-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="rk-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="rk-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="rk-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#rk-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<polygon points="40,136 32,100 38,64 56,44 78,42 94,58 98,100 92,136" fill="url(#rk-d12)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></polygon>
<text x="65" y="114" text-anchor="middle" fill="currentColor" font-family="'Noto Sans Runic', sans-serif" font-size="60">{{rune}}</text>
<g fill="currentColor">
<text x="106" y="76" font-family="Silkscreen, monospace" font-size="8">{{aett}}</text>
<text x="106" y="90" font-family="Silkscreen, monospace" font-size="8">{{name}}</text>
<text x="106" y="104" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="12">{{meaning}}</text>
<text x="106" y="128" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="22">{{time}}</text>
</g>
<path d="M50 146H126M50 160H126" fill="none" stroke="currentColor" stroke-width="0.8"></path>
<path d="{{notches}}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
<rect width="176" height="176" fill="url(#rk-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#rk-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="22" font-family="'Noto Sans Runic', sans-serif" font-size="12">ᛋᛖᚲ</text>
<text x="144" y="45" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="24">{{ss}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#rk-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const runes = [
      ['ᚠ', 'FEHU', 'богатство'], ['ᚢ', 'URUZ', 'тур'], ['ᚦ', 'THURISAZ', 'великан'], ['ᚨ', 'ANSUZ', 'бог'],
      ['ᚱ', 'RAIDO', 'путь'], ['ᚲ', 'KAUNAN', 'факел'], ['ᚷ', 'GEBO', 'дар'], ['ᚹ', 'WUNJO', 'радость'],
      ['ᚺ', 'HAGALAZ', 'град'], ['ᚾ', 'NAUDIZ', 'нужда'], ['ᛁ', 'ISAZ', 'лёд'], ['ᛃ', 'JERA', 'год'],
      ['ᛇ', 'EIHWAZ', 'тис'], ['ᛈ', 'PERTHRO', 'жребий'], ['ᛉ', 'ALGIZ', 'лось'], ['ᛊ', 'SOWILO', 'солнце'],
      ['ᛏ', 'TIWAZ', 'Тюр'], ['ᛒ', 'BERKANO', 'берёза'], ['ᛖ', 'EHWAZ', 'конь'], ['ᛗ', 'MANNAZ', 'человек'],
      ['ᛚ', 'LAGUZ', 'вода'], ['ᛜ', 'INGWAZ', 'Инг'], ['ᛞ', 'DAGAZ', 'день'], ['ᛟ', 'OTHALA', 'наследие']
    ];
    let hour;
    let minute;
    let frac;
    if (demo) {
      hour = Math.floor(nowMs / 24000) % 24;
      minute = Math.floor(nowMs / 400) % 60;
      frac = (nowMs % 400) / 400;
    } else {
      hour = now.getHours();
      minute = now.getMinutes();
      frac = Math.min(1, now.getSeconds() / 2);
    }
    let notches = '';
    const total = minute + 1;
    for (let i = 0; i < total; i++) {
      const row = i < 30 ? 0 : 1;
      const j = i % 30;
      const g = Math.floor(j / 5);
      const k = j % 5;
      const y = row === 0 ? 146 : 160;
      const x = 52 + g * 12;
      const grow = i === total - 1 ? Math.max(0.15, frac) : 1;
      if (k < 4) {
        const xx = x + k * 2.4;
        notches += 'M' + xx.toFixed(1) + ' ' + (y - 5) + 'L' + xx.toFixed(1) + ' ' + (y - 5 + 10 * grow).toFixed(1);
      } else {
        const x0 = x - 1;
        const y0 = y + 5;
        notches += 'M' + x0 + ' ' + y0 + 'L' + (x0 + 9.4 * grow).toFixed(1) + ' ' + (y0 - 10 * grow).toFixed(1);
      }
    }
    const r = runes[hour];
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      rune: r[0],
      aett: 'AETT ' + (Math.floor(hour / 8) + 1),
      name: r[1],
      meaning: r[2],
      time: p2(hour) + ':' + p2(minute),
      notches: notches,
      ss: p2(now.getSeconds())
    };
  }
}
</script>
</body>
</html>
