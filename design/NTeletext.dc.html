<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телетекст</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Телетекст»: страница 100 с заголовком и часами с секундами, подстраницы погода, тело и активность сменяются с поиском страницы, кнопки фастекста внизу, номер страницы в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="tt-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="tt-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="tt-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#tt-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="26" y="40" fill="currentColor" font-family="VT323, monospace" font-size="13">{{header}}</text>
<rect x="0" y="48" width="176" height="18" fill="currentColor"></rect>
<text x="26" y="63" fill="{{bg}}" font-family="'Jersey 10', monospace" font-size="18">TELETEXT</text>
<g fill="{{bg}}">
<rect x="92" y="51" width="3" height="4"></rect>
<rect x="95" y="55" width="3" height="4"></rect>
<rect x="98" y="51" width="3" height="4"></rect>
<rect x="98" y="59" width="3" height="4"></rect>
<rect x="101" y="55" width="3" height="4"></rect>
<rect x="104" y="51" width="3" height="4"></rect>
</g>
<g fill="currentColor" font-family="VT323, monospace" font-size="13" opacity="{{contentOp}}">
<text x="26" y="84">{{l0}}</text>
<text x="26" y="98">{{l1}}</text>
<text x="26" y="112">{{l2}}</text>
<text x="26" y="126">{{l3}}</text>
<text x="150" y="140" text-anchor="end">{{sub}}</text>
</g>
<rect x="36.5" y="146.5" width="32" height="12" fill="{{f0}}" stroke="currentColor" stroke-width="1"></rect>
<rect x="72.5" y="146.5" width="32" height="12" fill="{{f1}}" stroke="currentColor" stroke-width="1"></rect>
<rect x="108.5" y="146.5" width="32" height="12" fill="{{f2}}" stroke="currentColor" stroke-width="1"></rect>
<g font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="52.5" y="155.5" fill="{{c0}}">WX</text>
<text x="88.5" y="155.5" fill="{{c1}}">BODY</text>
<text x="124.5" y="155.5" fill="{{c2}}">STEP</text>
</g>
<rect width="176" height="176" fill="url(#tt-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#tt-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">PAGE</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{page}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">TXT</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#tt-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 100);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const bg = dark ? '#141512' : '#c6c9bc';
    const ink = dark ? '#d7dacd' : '#161713';
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const subs = [
      ['WEATHER TASHKENT', 'NOW 12C RAIN 80%', 'TONIGHT 6C CLEAR', 'WIND NW 4 M/S'],
      ['BODY STATUS', 'HEART 62 BPM', 'BATTERY 72 STRESS 28', 'SLEEP 7H 12M'],
      ['ACTIVITY', 'STEPS 8412/10000', '[########--] 84%', 'FLOORS 11 KCAL 2140']
    ];
    const si = Math.floor(nowMs / 5000) % 3;
    const inSub = nowMs % 5000;
    const searching = inSub < 600;
    const page = searching ? String(100 + Math.floor(Math.random() * 99)) : '100';
    const clock = p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':' + p2(now.getSeconds());
    const lines = subs[si];
    const fill = (i) => (i === si ? ink : bg);
    const col = (i) => (i === si ? bg : ink);
    return {
      bg: bg,
      ink: ink,
      caseColor: this.props.caseColor ?? '#2b2d29',
      header: 'P' + page + ' ' + clock,
      contentOp: searching ? 0 : 1,
      l0: lines[0],
      l1: lines[1],
      l2: lines[2],
      l3: lines[3],
      sub: (si + 1) + '/3',
      f0: fill(0), f1: fill(1), f2: fill(2),
      c0: col(0), c1: col(1), c2: col(2),
      page: page
    };
  }
}
</script>
</body>
</html>
