<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сейсмограф пульса</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Сейсмограф»: пульс пишется пером на бумажной ленте, лента с сеткой ползёт влево, минимум и максимум внизу, удары в минуту с мигающим сердцем в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="sm-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="sm-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="sm-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="sm-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#sm-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="26" y="50" fill="currentColor" font-family="'Jersey 10', monospace" font-size="30" textLength="56" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<g fill="url(#sm-d25)">
<rect x="0" y="70" width="176" height="1"></rect>
<rect x="0" y="82" width="176" height="1"></rect>
<rect x="0" y="94" width="176" height="1"></rect>
<rect x="0" y="106" width="176" height="1"></rect>
<rect x="0" y="118" width="176" height="1"></rect>
</g>
<path d="{{vgrid}}" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"></path>
<rect x="0" y="60" width="176" height="1" fill="currentColor"></rect>
<rect x="0" y="129" width="176" height="1" fill="currentColor"></rect>
<path d="{{trace}}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="{{arm}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<path d="{{tip}}" fill="currentColor"></path>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="88" y="146">{{range}}</text>
<text x="88" y="160">{{date}}</text>
</g>
<rect width="176" height="176" fill="url(#sm-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#sm-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">BPM</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{bpm}}</text>
</g>
<polygon points="144,57 139,52 139,50 141,48 143,48 144,50 145,48 147,48 149,50 149,52" fill="currentColor" opacity="{{beat}}"></polygon>
<rect x="113" y="1" width="62" height="62" fill="url(#sm-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 120);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  sample(n) {
    let v = 62 + 5 * Math.sin(n / 23) + 3 * Math.sin(n / 7.3) + (Math.random() * 4 - 2);
    const b = n % 220;
    if (b < 40) v += 45 * Math.sin((Math.PI * b) / 40);
    return v;
  }
  ensure() {
    if (!this.buf) {
      this.n = 0;
      this.buf = [];
      for (let i = 0; i < 64; i++) {
        this.buf.push(this.sample(this.n));
        this.n++;
      }
    }
  }
  tick() {
    this.ensure();
    this.buf.push(this.sample(this.n));
    this.n++;
    this.buf.shift();
    this.setState({ n: this.n });
  }
  renderVals() {
    this.ensure();
    const dark = (this.props.mode ?? 'light') === 'dark';
    const now = new Date();
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const buf = this.buf;
    const ys = buf.map((v) => Math.max(62, Math.min(126, 124 - (v - 45) * 0.75)));
    let trace = '';
    for (let i = 0; i < ys.length; i++) {
      trace += (i ? 'L' : 'M') + (4 + 2 * i) + ' ' + ys[i].toFixed(1);
    }
    const cur = ys[ys.length - 1];
    const off = (this.n * 2) % 16;
    let vgrid = '';
    for (let x = 130 - off; x > 0; x -= 16) {
      vgrid += 'M' + x + ' 62V128';
    }
    const bpm = Math.round(buf[buf.length - 1]);
    let mn = 999;
    let mx = 0;
    for (let i = 0; i < buf.length; i++) {
      if (buf[i] < mn) mn = buf[i];
      if (buf[i] > mx) mx = buf[i];
    }
    const period = 60 / Math.max(40, bpm);
    const beatOn = ((Date.now() / 1000) % period) < period * 0.35;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      trace: trace,
      vgrid: vgrid || 'M0 0',
      arm: 'M130 62L130 ' + (cur - 5).toFixed(1),
      tip: 'M130 ' + cur.toFixed(1) + 'L126 ' + (cur - 5).toFixed(1) + 'L134 ' + (cur - 5).toFixed(1) + 'Z',
      range: 'MIN ' + Math.round(mn) + '  MAX ' + Math.round(mx),
      bpm: String(bpm),
      beat: beatOn ? 1 : 0
    };
  }
}
</script>
</body>
</html>
