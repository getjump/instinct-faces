<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Газоразрядные лампы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nixie+One&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Газоразрядные лампы»: четыре стеклянные колбы с сеткой, проволочные цифры с растровым ореолом свечения, мигающие неоновые точки, раз в минуту цифры прокручиваются; секунды в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="nx-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="nx-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="nx-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="nx-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="nx-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#nx-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="url(#nx-d12)" stroke="currentColor" stroke-width="1.5">
<rect x="16" y="68" width="30" height="50" rx="13"></rect>
<rect x="50" y="68" width="30" height="50" rx="13"></rect>
<rect x="92" y="68" width="30" height="50" rx="13"></rect>
<rect x="126" y="68" width="30" height="50" rx="13"></rect>
</g>
<g fill="none" stroke="currentColor" stroke-width="1">
<path d="M21 74Q24 70 28 70M55 74Q58 70 62 70M97 74Q100 70 104 70M131 74Q134 70 138 70"></path>
</g>
<g font-family="'Nixie One', serif" font-size="40" text-anchor="middle">
<g fill="none" stroke="url(#nx-d25)" stroke-width="6" stroke-linejoin="round">
<text x="31" y="108">{{d0}}</text>
<text x="65" y="108">{{d1}}</text>
<text x="107" y="108">{{d2}}</text>
<text x="141" y="108">{{d3}}</text>
</g>
<g fill="currentColor">
<text x="31" y="108">{{d0}}</text>
<text x="65" y="108">{{d1}}</text>
<text x="107" y="108">{{d2}}</text>
<text x="141" y="108">{{d3}}</text>
</g>
</g>
<g opacity="{{colon}}">
<circle cx="86" cy="86" r="4.5" fill="url(#nx-d25)"></circle>
<circle cx="86" cy="102" r="4.5" fill="url(#nx-d25)"></circle>
<circle cx="86" cy="86" r="2" fill="currentColor"></circle>
<circle cx="86" cy="102" r="2" fill="currentColor"></circle>
</g>
<rect x="12" y="118" width="148" height="4" fill="currentColor"></rect>
<g fill="currentColor">
<rect x="24" y="122" width="2" height="4"></rect><rect x="36" y="122" width="2" height="4"></rect>
<rect x="58" y="122" width="2" height="4"></rect><rect x="70" y="122" width="2" height="4"></rect>
<rect x="100" y="122" width="2" height="4"></rect><rect x="112" y="122" width="2" height="4"></rect>
<rect x="134" y="122" width="2" height="4"></rect><rect x="146" y="122" width="2" height="4"></rect>
</g>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="88" y="142">{{date}}</text>
<text x="88" y="154">170V</text>
</g>
<rect width="176" height="176" fill="url(#nx-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#nx-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g font-family="'Nixie One', serif" font-size="28" text-anchor="middle">
<text x="144" y="44" fill="none" stroke="url(#nx-d25)" stroke-width="5" stroke-linejoin="round">{{ss}}</text>
<text x="144" y="44" fill="currentColor">{{ss}}</text>
</g>
<text x="144" y="56" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">SEC</text>
<rect x="113" y="1" width="62" height="62" fill="url(#nx-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const hhmm = p2(now.getHours()) + p2(now.getMinutes());
    const key = demo ? Math.floor(nowMs / 8000) : now.getHours() * 60 + now.getMinutes();
    if (this.key !== key) {
      if (this.key !== undefined) this.cycleAt = nowMs;
      this.key = key;
    }
    const el = nowMs - (this.cycleAt || 0);
    const digits = [];
    for (let i = 0; i < 4; i++) {
      if (el < 1000) digits.push(String((parseInt(hhmm[i], 10) + Math.floor(el / 60) + i * 3) % 10));
      else digits.push(hhmm[i]);
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      d0: digits[0],
      d1: digits[1],
      d2: digits[2],
      d3: digits[3],
      colon: now.getSeconds() % 2 === 0 ? 1 : 0,
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      ss: p2(now.getSeconds())
    };
  }
}
</script>
</body>
</html>
