<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Швейцарский плакат</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Швейцарский плакат»: время словами жёсткой вёрсткой в три строки, при смене минуты буквы перемешиваются, тонкая полоса секунд, секунды крупно в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="sw-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="sw-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="sw-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#sw-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="34" y="28" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{meta}}</text>
<g fill="currentColor" font-family="Anton, 'Arial Narrow', sans-serif">
<text x="22" y="66" font-size="{{l1.fs}}" textLength="{{l1.tl}}" lengthAdjust="spacingAndGlyphs">{{l1.w}}</text>
<text x="22" y="100" font-size="{{l2.fs}}" textLength="{{l2.tl}}" lengthAdjust="spacingAndGlyphs">{{l2.w}}</text>
<text x="22" y="134" font-size="{{l3.fs}}" textLength="{{l3.tl}}" lengthAdjust="spacingAndGlyphs">{{l3.w}}</text>
</g>
<rect x="22" y="142" width="132" height="1" fill="currentColor"></rect>
<rect x="22" y="144" width="{{bar}}" height="3" fill="currentColor"></rect>
<text x="40" y="160" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">TASHKENT 41.3N</text>
<rect width="176" height="176" fill="url(#sw-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#sw-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="46" font-family="Anton, 'Arial Narrow', sans-serif" font-size="30">{{ss}}</text>
<text x="144" y="57" font-family="Silkscreen, monospace" font-size="8">SEC</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#sw-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.mount = Date.now();
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const ones = ['ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
    const tens = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY'];
    let h;
    let m;
    let s;
    if (demo) {
      const base = this.mount || nowMs;
      const add = Math.floor((nowMs - base) / 4000);
      const tot = now.getHours() * 60 + now.getMinutes() + add;
      h = Math.floor(tot / 60) % 24;
      m = tot % 60;
      s = Math.floor((((nowMs - base) % 4000) / 4000) * 60);
    } else {
      h = now.getHours();
      m = now.getMinutes();
      s = now.getSeconds();
    }
    const hw = h < 20 ? ones[h] : 'TWENTY' + (h > 20 ? '-' + ones[h - 20] : '');
    let mw;
    if (m === 0) mw = ["O'CLOCK", ''];
    else if (m < 10) mw = ['OH', ones[m]];
    else if (m < 20) mw = [ones[m], ''];
    else mw = [tens[Math.floor(m / 10)] + (m % 10 ? '-' : ''), m % 10 ? ones[m % 10] : ''];
    const key = h * 60 + m;
    if (this.lastKey !== key) {
      this.lastKey = key;
      this.changedAt = nowMs;
    }
    const scr = nowMs - (this.changedAt || 0) < 500;
    const scramble = (w) => w.split('').map((ch) => (ch === '-' || ch === "'" ? ch : String.fromCharCode(65 + Math.floor(Math.random() * 26)))).join('');
    const fit = (w, W, maxFs) => {
      const len = Math.max(1, w.length);
      const fs = Math.min(maxFs, W / (len * 0.47));
      return { w: scr ? scramble(w) : w, fs: fs.toFixed(1), tl: (len * 0.47 * fs).toFixed(1) };
    };
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      meta: days[now.getDay()] + ' ' + p2(now.getDate()) + '.' + p2(now.getMonth() + 1),
      l1: fit(hw, 88, 36),
      l2: fit(mw[0], 130, 36),
      l3: fit(mw[1], 120, 36),
      bar: ((132 * s) / 60).toFixed(1),
      ss: p2(s)
    };
  }
}
</script>
</body>
</html>
