<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Consumer lag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>

a{color:#555}a:hover{color:#222}

<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Consumer lag»: день как партиция Kafka из 24 часов-сегментов, закоммичено 14, в окошке — отставание по шагам">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>

<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="k-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="k-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="k-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="k-full" x="26" y="114" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="4" height="10" fill="currentColor"></rect></pattern>
<pattern id="k-empty" x="26" y="114" width="5" height="10" patternUnits="userSpaceOnUse"><rect x="0.5" y="0.5" width="3" height="9" fill="none" stroke="currentColor" stroke-width="1"></rect></pattern>
<pattern id="k-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#k-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8">
<text x="30" y="38">TOPIC: DAY</text>
<text x="26" y="52">FRI 06 NOV</text>

</g>
<text x="24" y="104" fill="currentColor" font-family="'Jersey 10', monospace" font-size="50" textLength="108" lengthAdjust="spacingAndGlyphs">14:32</text>
<rect x="26" y="114" width="70" height="10" fill="url(#k-full)"></rect>
<rect x="96" y="114" width="4" height="10" fill="url(#k-d50)"></rect>
<rect x="101" y="114" width="45" height="10" fill="url(#k-empty)"></rect>
<rect x="97" y="127" width="2" height="1" fill="currentColor"></rect>
<rect x="96" y="128" width="4" height="1" fill="currentColor"></rect>
<rect x="95" y="129" width="6" height="1" fill="currentColor"></rect>
<rect width="176" height="176" fill="url(#k-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#k-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="22" font-family="Silkscreen, monospace" font-size="8">LAG</text>
<text x="144" y="47" font-family="'Jersey 10', monospace" font-size="28" textLength="40" lengthAdjust="spacingAndGlyphs">1.6K</text>
<text x="144" y="57" font-family="Silkscreen, monospace" font-size="8">STEPS</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#k-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29'
    };
  }
}
</script>
</body>
</html>
