<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лабиринт 10 PRINT</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Лабиринт 10 PRINT»: экран заполнен случайными диагоналями, время выложено сплошными блоками внутри лабиринта, лабиринт перерисовывается волной, дата в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="mz-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="mz-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="mz-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#mz-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<path d="{{maze}}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
<path d="{{digits}}" fill="currentColor"></path>
<rect width="176" height="176" fill="url(#mz-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#mz-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">{{mon}}</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{dd}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{dow}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#mz-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const period = demo ? 3000 : 60000;
    const epoch = Math.floor(nowMs / period);
    if (this.ep !== epoch) {
      this.prevSeed = this.seed === undefined ? epoch * 7919 : this.seed;
      this.seed = epoch * 7919;
      this.ep = epoch;
      this.changeAt = nowMs;
    }
    const prog = Math.min(1, (nowMs - this.changeAt) / 900) * 484;
    const font = {
      '0': ['111', '101', '101', '101', '111'],
      '1': ['010', '110', '010', '010', '111'],
      '2': ['111', '001', '111', '100', '111'],
      '3': ['111', '001', '111', '001', '111'],
      '4': ['101', '101', '111', '001', '001'],
      '5': ['111', '100', '111', '001', '111'],
      '6': ['111', '100', '111', '101', '111'],
      '7': ['111', '001', '010', '010', '010'],
      '8': ['111', '101', '111', '101', '111'],
      '9': ['111', '101', '111', '001', '111'],
      ':': ['0', '1', '0', '1', '0']
    };
    const time = p2(now.getHours()) + ':' + p2(now.getMinutes());
    const mask = {};
    let col = 3;
    const row0 = 9;
    for (let k = 0; k < time.length; k++) {
      const g = font[time[k]];
      const w = g[0].length;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < w; c++) {
          if (g[r][c] === '1') mask[(row0 + r) * 22 + col + c] = true;
        }
      }
      col += w + 1;
    }
    let maze = '';
    let digits = '';
    for (let i = 0; i < 484; i++) {
      const x = (i % 22) * 8;
      const y = Math.floor(i / 22) * 8;
      if (mask[i]) {
        digits += 'M' + x + ' ' + y + 'h8v8h-8z';
        continue;
      }
      const seed = i < prog ? this.seed : this.prevSeed;
      const bit = (Math.imul((i + 1) ^ seed, 2654435761) >>> 13) & 1;
      maze += bit ? 'M' + x + ' ' + y + 'l8 8' : 'M' + (x + 8) + ' ' + y + 'l-8 8';
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      maze: maze,
      digits: digits || 'M0 0',
      mon: mons[now.getMonth()],
      dd: p2(now.getDate()),
      dow: days[now.getDay()]
    };
  }
}
</script>
</body>
</html>
