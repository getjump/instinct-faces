<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Солнечный доход</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Солнечный доход»: кривая интенсивности солнца за сутки с растровой заливкой до текущего момента, прогноз пунктиром, заработанные минуты заряда, интенсивность сейчас в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="so-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="so-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="so-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="so-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#so-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="26" y="52" fill="currentColor" font-family="'Jersey 10', monospace" font-size="30" textLength="56" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<path d="M20 105H156" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"></path>
<path d="M20 70H156" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"></path>
<path d="{{area}}" fill="url(#so-d50)"></path>
<path d="{{ghost}}" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 2"></path>
<path d="{{line}}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
<path d="{{nowLine}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<circle cx="{{mx}}" cy="{{my}}" r="3" fill="{{bg}}" stroke="currentColor" stroke-width="1.5"></circle>
<rect x="20" y="140" width="136" height="1" fill="currentColor"></rect>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="54" y="150">6</text>
<text x="88" y="150">12</text>
<text x="122" y="150">18</text>
<text x="88" y="164">{{income}}</text>
</g>
<rect width="176" height="176" fill="url(#so-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#so-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">SUN</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{cur}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">NOW</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#so-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 100);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    let h;
    if (demo) {
      h = 24 * ((nowMs % 24000) / 24000);
    } else {
      h = now.getHours() + now.getMinutes() / 60;
    }
    const X = (hh) => 20 + hh * (136 / 24);
    const Y = (v) => 140 - v * 70;
    const sol = (hh) => {
      if (hh < 7.2 || hh > 17.2) return 0;
      const base = Math.sin((Math.PI * (hh - 7.2)) / 10);
      const cloud = 0.78 + 0.22 * Math.sin(hh * 3.1 + 1) * Math.sin(hh * 1.7);
      return Math.max(0, base * cloud);
    };
    const step = 0.2;
    let line = '';
    let area = 'M' + f(X(0)) + ' 140';
    let sum = 0;
    let first = true;
    for (let hh = 0; hh <= h + 1e-6; hh += step) {
      const v = sol(hh);
      sum += v * step;
      line += (first ? 'M' : 'L') + f(X(hh)) + ' ' + f(Y(v));
      area += 'L' + f(X(hh)) + ' ' + f(Y(v));
      first = false;
    }
    line += 'L' + f(X(h)) + ' ' + f(Y(sol(h)));
    area += 'L' + f(X(h)) + ' ' + f(Y(sol(h))) + 'L' + f(X(h)) + ' 140Z';
    let ghost = '';
    first = true;
    for (let hh = h; hh <= 24 + 1e-6; hh += step) {
      ghost += (first ? 'M' : 'L') + f(X(hh)) + ' ' + f(Y(sol(hh)));
      first = false;
    }
    const cur = sol(h);
    const hr = Math.floor(h);
    const mn = Math.floor((h - hr) * 60);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: demo ? p2(hr % 24) + ':' + p2(mn) : p2(now.getHours()) + ':' + p2(now.getMinutes()),
      area: area,
      line: line,
      ghost: ghost || 'M0 0',
      nowLine: 'M' + f(X(h)) + ' 66V140',
      mx: f(X(h)),
      my: f(Y(cur)),
      income: 'TODAY +' + Math.round(sum * 9) + ' MIN',
      cur: Math.round(cur * 100) + '%'
    };
  }
}
</script>
</body>
</html>
