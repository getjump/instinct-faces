<g clip-path="url(#sf-b1)"><rect x="54" y="70" width="32" height="48" rx="3" fill="currentColor"></rect><text x="70" y="110" fill="{{bg}}">{{c1.bot}}</text></g>
<g clip-path="url(#sf-t1)"><g transform="{{c1.tfT}}"><rect x="54" y="70" width="32" height="48" rx="3" fill="currentColor"></rect><text x="70" y="110" fill="{{bg}}">{{c1.fT}}</text></g></g>
<g clip-path="url(#sf-b1)"><g transform="{{c1.tfB}}"><rect x="54" y="70" width="32" height="48" rx="3" fill="currentColor"></rect><text x="70" y="110" fill="{{bg}}">{{c1.fB}}</text></g></g>

<g clip-path="url(#sf-b4)"><rect x="125" y="20" width="18" height="28" rx="2" fill="currentColor"></rect><text x="134" y="43" fill="{{bg}}">{{c4.bot}}</text></g>
<g clip-path="url(#sf-t4)"><g transform="{{c4.tfT}}"><rect x="125" y="20" width="18" height="28" rx="2" fill="currentColor"></rect><text x="134" y="43" fill="{{bg}}">{{c4.fT}}</text></g></g>

</g>

<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;section&quot;:&quot;Экран&quot;},&quot;caseColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#2b2d29&quot;,&quot;#56603f&quot;,&quot;#b5472b&quot;,&quot;#cfc9ba&quot;],&quot;default&quot;:&quot;#2b2d29&quot;,&quot;section&quot;:&quot;Корпус&quot;},&quot;demo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Анимация&quot;},&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:560}}">
class Component extends DCLogic {
  componentDidMount() {
    this.mount = Date.now();
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 50);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  digits(nowMs) {
    const now = new Date(nowMs);
    const demo = this.props.demo ?? true;
    let h;
    let m;
    if (demo) {
      const base = this.mount || nowMs;
      const add = Math.floor((nowMs - base) / 3000);
      const tot = now.getHours() * 60 + now.getMinutes() + add;
      h = Math.floor(tot / 60) % 24;
      m = tot % 60;
    } else {
      h = now.getHours();
      m = now.getMinutes();
    }
    const s = now.getSeconds();
    return [Math.floor(h / 10), h % 10, Math.floor(m / 10), m % 10, Math.floor(s / 10), s % 10];
  }
  update(nowMs) {
    const d = this.digits(nowMs);
    if (!this.cur) {
      this.cur = d.slice();
      this.old = d.slice();
      this.start = [0, 0, 0, 0, 0, 0];
      return;
    }
    for (let i = 0; i < 6; i++) {
      if (d[i] !== this.cur[i]) {
        this.old[i] = this.cur[i];
        this.cur[i] = d[i];
        this.start[i] = nowMs + (i < 4 ? (3 - i) * 70 : (5 - i) * 70);
      }
    }
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    this.update(nowMs);
    const D = 360;
    const card = (i, mid) => {
      const p = (nowMs - this.start[i]) / D;
      const cur = String(this.cur[i]);
      const old = String(this.old[i]);
      const tf = (k) => 'translate(0 ' + mid + ') scale(1 ' + k.toFixed(3) + ') translate(0 ' + (-mid) + ')';
      if (p < 0) return { top: old, bot: old, fT: old, fB: cur, tfT: tf(0), tfB: tf(0) };
      if (p >= 1) return { top: cur, bot: cur, fT: cur, fB: cur, tfT: tf(0), tfB: tf(0) };
      if (p < 0.5) return { top: cur, bot: old, fT: old, fB: cur, tfT: tf(1 - 2 * p), tfB: tf(0) };
      return { top: cur, bot: old, fT: old, fB: cur, tfT: tf(0), tfB: tf(2 * p - 1) };
    };
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      c0: card(0, 94),
      c1: card(1, 94),
      c2: card(2, 94),
      c3: card(3, 94),
      c4: card(4, 34),
      c5: card(5, 34),
      colon: now.getSeconds() % 2 === 0 ? 1 : 0
    };
  }
}
</script>

</html>
