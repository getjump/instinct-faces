<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лиссажу</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Лиссажу»: фигура Лиссажу с частотами из часов и минут медленно вращается по фазе, время на табличке, соотношение частот в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="ls-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="ls-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="ls-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#ls-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<path d="M28 92H144M86 42V142" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"></path>
<path d="{{curve}}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
<circle cx="{{dx}}" cy="{{dy}}" r="2.5" fill="currentColor"></circle>
<rect x="56.5" y="148.5" width="63" height="19" fill="{{bg}}" stroke="currentColor" stroke-width="1"></rect>
<text x="88" y="164" text-anchor="middle" fill="currentColor" font-family="'Jersey 10', monospace" font-size="20" textLength="40" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<rect width="176" height="176" fill="url(#ls-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#ls-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">A:B</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{ratio}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{phase}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#ls-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    let a = (now.getHours() % 5) + 1;
    let b = (now.getMinutes() % 7) + 2;
    if (demo) {
      const k = Math.floor(nowMs / 6000);
      a = (k % 5) + 1;
      b = ((k * 3) % 7) + 2;
    }
    if (a === b) b++;
    const delta = (nowMs / 1000) * 0.6;
    let curve = '';
    const N = 400;
    for (let i = 0; i <= N; i++) {
      const tt = (i / N) * Math.PI * 2;
      const x = 86 + 58 * Math.sin(a * tt + delta);
      const y = 92 + 50 * Math.sin(b * tt);
      curve += (i ? 'L' : 'M') + f(x) + ' ' + f(y);
    }
    const tp = ((nowMs / 1000) * 0.5) % (Math.PI * 2);
    const deg = Math.round(((delta * 180) / Math.PI) % 360);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      curve: curve,
      dx: f(86 + 58 * Math.sin(a * tp + delta)),
      dy: f(92 + 50 * Math.sin(b * tp)),
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      ratio: a + ':' + b,
      phase: deg + ' DEG'
    };
  }
}
</script>
</body>
</html>
