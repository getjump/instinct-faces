<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>72 микросезона</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «72 микросезона»: название текущего японского микросезона вертикальным столбцом кандзи с чтением и переводом, печать с именем сезона из двадцати четырёх, время и дата; номер части сезона в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="ko-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="ko-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="ko-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#ko-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<g fill="currentColor" font-family="'Shippori Mincho', serif" font-weight="800">
<text x="24" y="50" font-size="26">{{time}}</text>
<text x="24" y="66" font-size="11">{{date}}</text>
<text x="24" y="86" font-size="8">{{kana1}}</text>
<text x="24" y="96" font-size="8">{{kana2}}</text>
<text x="24" y="114" font-size="9">{{ru1}}</text>
<text x="24" y="126" font-size="9">{{ru2}}</text>
</g>
<path d="M104.5 64V160" fill="none" stroke="currentColor" stroke-width="0.8"></path>
<g fill="currentColor" font-family="'Shippori Mincho', serif" font-weight="800" font-size="24" text-anchor="middle">
<text x="120" y="86" opacity="{{k0o}}">{{k0}}</text>
<text x="120" y="110" opacity="{{k1o}}">{{k1}}</text>
<text x="120" y="134" opacity="{{k2o}}">{{k2}}</text>
<text x="120" y="158" opacity="{{k3o}}">{{k3}}</text>
</g>
<rect x="50" y="136" width="28" height="28" rx="3" fill="currentColor"></rect>
<rect x="52.5" y="138.5" width="23" height="23" rx="2" fill="none" stroke="{{bg}}" stroke-width="1"></rect>
<g fill="{{bg}}" font-family="'Shippori Mincho', serif" font-weight="800" font-size="11" text-anchor="middle">
<text x="64" y="149">{{s0}}</text>
<text x="64" y="160">{{s1}}</text>
</g>
<rect width="176" height="176" fill="url(#ko-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#ko-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle" font-family="'Shippori Mincho', serif" font-weight="800">
<text x="144" y="20" font-size="9">七十二候</text>
<text x="144" y="42" font-size="18">{{pos}}</text>
<text x="144" y="56" font-size="9">{{sekki}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#ko-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  kanjiNum(n) {
    const d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (n < 10) return d[n];
    const t = Math.floor(n / 10);
    const o = n % 10;
    return (t === 1 ? '' : d[t]) + '十' + (o ? d[o] : '');
  }
  wrap(text, max) {
    const words = text.split(' ');
    const lines = [''];
    for (let i = 0; i < words.length; i++) {
      const cur = lines[lines.length - 1];
      if (cur.length === 0) lines[lines.length - 1] = words[i];
      else if ((cur + ' ' + words[i]).length <= max) lines[lines.length - 1] = cur + ' ' + words[i];
      else lines.push(words[i]);
    }
    return lines;
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const kos = [
      [10, 23, '霜降', '霜始降', 'しもはじめてふる', 'Выпадает первый иней', 0],
      [10, 28, '霜降', '霎時施', 'こさめときどきふる', 'Временами моросит', 1],
      [11, 2, '霜降', '楓蔦黄', 'もみじつたきばむ', 'Желтеют клёны и плющ', 2],
      [11, 7, '立冬', '山茶始開', 'つばきはじめてひらく', 'Зацветают камелии', 0],
      [11, 12, '立冬', '地始凍', 'ちはじめてこおる', 'Земля начинает мёрзнуть', 1],
      [11, 17, '立冬', '金盞香', 'きんせんかさく', 'Благоухают нарциссы', 2],
      [11, 22, '小雪', '虹蔵不見', 'にじかくれてみえず', 'Радуги прячутся', 0],
      [11, 27, '小雪', '朔風払葉', 'きたかぜこのはをはらう', 'Северный ветер срывает листья', 1],
      [12, 2, '小雪', '橘始黄', 'たちばなはじめてきばむ', 'Желтеют мандарины', 2],
      [12, 7, '大雪', '閉塞成冬', 'そらさむくふゆとなる', 'Холодает, приходит зима', 0],
      [12, 12, '大雪', '熊蟄穴', 'くまあなにこもる', 'Медведи уходят в берлоги', 1],
      [12, 16, '大雪', '鱖魚群', 'さけのうおむらがる', 'Лосось идёт косяками', 2]
    ];
    const sekkis = [[1, 5, '小寒'], [1, 20, '大寒'], [2, 4, '立春'], [2, 19, '雨水'], [3, 5, '啓蟄'], [3, 20, '春分'], [4, 4, '清明'], [4, 20, '穀雨'], [5, 5, '立夏'], [5, 21, '小満'], [6, 5, '芒種'], [6, 21, '夏至'], [7, 7, '小暑'], [7, 22, '大暑'], [8, 7, '立秋'], [8, 23, '処暑'], [9, 7, '白露'], [9, 22, '秋分'], [10, 8, '寒露'], [10, 23, '霜降'], [11, 7, '立冬'], [11, 22, '小雪'], [12, 7, '大雪'], [12, 21, '冬至']];
    const md = (now.getMonth() + 1) * 100 + now.getDate();
    let entry = null;
    if (demo) {
      entry = kos[Math.floor(nowMs / 5000) % kos.length];
    } else {
      for (let i = 0; i < kos.length; i++) {
        if (md >= kos[i][0] * 100 + kos[i][1]) entry = kos[i];
      }
      if (md >= 1221 || md < 1023) {
        let sk = sekkis[sekkis.length - 1][2];
        for (let i = 0; i < sekkis.length; i++) {
          if (md >= sekkis[i][0] * 100 + sekkis[i][1]) sk = sekkis[i][2];
        }
        entry = [0, 0, sk, sk, '', '', 0];
      }
    }
    const key = demo ? Math.floor(nowMs / 5000) : entry[3];
    if (this.key !== key) {
      this.key = key;
      this.revealAt = nowMs;
    }
    const el = nowMs - this.revealAt;
    const chars = entry[3].split('');
    const kana = entry[4];
    const ru = this.wrap(entry[5], 14);
    const posNames = ['初候', '次候', '末候'];
    const v = {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      date: this.kanjiNum(now.getMonth() + 1) + '月' + this.kanjiNum(now.getDate()) + '日',
      kana1: kana.slice(0, 7),
      kana2: kana.slice(7),
      ru1: ru[0] || '',
      ru2: ru[1] || '',
      s0: entry[2][0] || '',
      s1: entry[2][1] || '',
      pos: posNames[entry[6]],
      sekki: entry[2]
    };
    for (let i = 0; i < 4; i++) {
      v['k' + i] = chars[i] || '';
      v['k' + i + 'o'] = el > i * 150 ? 1 : 0;
    }
    return v;
  }
}
</script>
</body>
</html>
