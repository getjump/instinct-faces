<!doctype html>

</head>
<body>

<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="fd-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="fd-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="fd-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#fd-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="24" y="36" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">FIELD 100M</text>
<circle cx="78" cy="102" r="57.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
<path d="{{minor}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<path d="{{major}}" fill="none" stroke="currentColor" stroke-width="2"></path>
<g fill="currentColor" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="13" text-anchor="middle">
<text x="99" y="70.1">1</text><text x="114.4" y="85.5">2</text><text x="120" y="106.5">3</text>
<text x="114.4" y="127.5">4</text><text x="99" y="142.9">5</text><text x="78" y="148.5">6</text>
<text x="57" y="142.9">7</text><text x="41.6" y="127.5">8</text><text x="36" y="106.5">9</text>
<text x="41.6" y="85.5">10</text><text x="57" y="70.1">11</text><text x="78" y="64.5">12</text>
</g>
<g fill="currentColor" font-family="VT323, monospace" font-size="10" text-anchor="middle">
<text x="93.5" y="78.7">13</text><text x="104.8" y="90">14</text><text x="109" y="105.5">15</text>
<text x="104.8" y="121">16</text><text x="93.5" y="132.3">17</text><text x="78" y="136.5">18</text>
<text x="62.5" y="132.3">19</text><text x="51.2" y="121">20</text><text x="47" y="105.5">21</text>
<text x="51.2" y="90">22</text><text x="62.5" y="78.7">23</text><text x="78" y="74.5">24</text>
</g>
<g transform="{{hTf}}">
<polygon points="78,102 74.5,97 74.5,76 78,70 81.5,76 81.5,97" fill="currentColor"></polygon>
<polygon points="78,93 76.5,91 76.5,78 78,75 79.5,78 79.5,91" fill="{{bg}}"></polygon>
</g>
<g transform="{{mTf}}">
<polygon points="78,102 75.5,97 75.5,58 78,51 80.5,58 80.5,97" fill="currentColor"></polygon>
<polygon points="78,93 77,91 77,60 78,56 79,60 79,91" fill="{{bg}}"></polygon>
</g>
<g transform="{{sTf}}">
<rect x="77.5" y="47" width="1" height="66" fill="currentColor"></rect>
<rect x="76.5" y="108" width="3" height="8" fill="currentColor"></rect>
</g>
<circle cx="78" cy="102" r="3" fill="currentColor"></circle>
<circle cx="78" cy="102" r="1" fill="{{bg}}"></circle>
<rect width="176" height="176" fill="url(#fd-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#fd-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<rect x="132.5" y="22.5" width="23" height="18" fill="{{bg}}" stroke="currentColor" stroke-width="1"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="37" font-family="'Jersey 10', monospace" font-size="18">{{dd}}</text>
<text x="144" y="53" font-family="Silkscreen, monospace" font-size="8">{{dow}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#fd-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 100);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const now = new Date();
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const f = (v) => v.toFixed(1);
    if (!this.ticks) {
      let minor = '';
      let major = '';
      for (let i = 0; i < 60; i++) {
        const a = (i * 6 * Math.PI) / 180;
        const big = i % 5 === 0;
        const r1 = big ? 49 : 53;
        const seg = 'M' + f(78 + r1 * Math.sin(a)) + ' ' + f(102 - r1 * Math.cos(a)) + 'L' + f(78 + 56 * Math.sin(a)) + ' ' + f(102 - 56 * Math.cos(a));
        if (big) major += seg;
        else minor += seg;
      }
      this.ticks = [minor, major];
    }
    const s = now.getSeconds() + now.getMilliseconds() / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      minor: this.ticks[0],
      major: this.ticks[1],
      hTf: 'rotate(' + f(h * 30) + ' 78 102)',
      mTf: 'rotate(' + f(m * 6) + ' 78 102)',
      sTf: 'rotate(' + f(s * 6) + ' 78 102)',
      dd: p2(now.getDate()),
      dow: days[now.getDay()]
    };
  }
}
</script>
</body>
</html>
