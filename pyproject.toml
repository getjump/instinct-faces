[project]
name = "instinct-faces"
version = "0.1.0"
description = "One-bit Connect IQ watch faces for Garmin Instinct 3 Solar, with build tools and a live preview site"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["design", "refs", "previews", "build", "dist", ".work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["build", "check", "gallery", "shot", "strip_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
