<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дайверские</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Дайверские»: чёрный вращающийся безель с минутной шкалой и треугольником нуля, крупные метки часов, стрелка-указатель и меч, секундная с кружком; безель поворачивается к минутной стрелке в начале погружения, время погружения и глубина в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="dv-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="dv-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="dv-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#dv-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="24" y="36" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">200M</text>
<g transform="{{bezTf}}">
<path d="M20 102a58 58 0 1 0 116 0a58 58 0 1 0 -116 0Z M31 102a47 47 0 1 0 94 0a47 47 0 1 0 -94 0Z" fill="currentColor" fill-rule="evenodd"></path>
<polygon points="78,54 73.5,46 82.5,46" fill="{{bg}}"></polygon>
<path d="{{bezLines}}" fill="none" stroke="{{bg}}" stroke-width="1"></path>
<path d="{{bezBars}}" fill="none" stroke="{{bg}}" stroke-width="2"></path>
<path d="{{bezDots}}" fill="{{bg}}"></path>
<g fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="123.5" y="81.8">10</text>
<text x="123.5" y="131.3">20</text>
<text x="78" y="157.5">30</text>
<text x="32.5" y="131.3">40</text>
<text x="32.5" y="81.8">50</text>
</g>
</g>
<path d="{{markers}}" fill="currentColor"></path>
<g transform="{{hTf}}">
<path d="M76 104 L76 82 L72 82 L78 70 L84 82 L80 82 L80 104 Z" fill="currentColor"></path>
<path d="M77.2 98 L77.2 83 L78 80.5 L78.8 83 L78.8 98 Z" fill="{{bg}}"></path>
</g>
<g transform="{{mTf}}">
<path d="M76.5 104 L76.5 64 L78 56 L79.5 64 L79.5 104 Z" fill="currentColor"></path>
<path d="M77.5 98 L77.5 65 L78 61 L78.5 65 L78.5 98 Z" fill="{{bg}}"></path>
</g>
<g transform="{{sTf}}">
<rect x="77.5" y="58" width="1" height="54" fill="currentColor"></rect>
<circle cx="78" cy="69" r="2.8" fill="currentColor"></circle>
<circle cx="78" cy="69" r="1.1" fill="{{bg}}"></circle>
<rect x="76.5" y="106" width="3" height="7" fill="currentColor"></rect>
</g>
<circle cx="78" cy="102" r="3" fill="currentColor"></circle>
<rect width="176" height="176" fill="url(#dv-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#dv-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">DIVE</text>
<text x="144" y="43" font-family="'Jersey 10', monospace" font-size="24">{{elapsed}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{depth}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#dv-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const P = (a, r) => [78 + r * Math.sin((a * Math.PI) / 180), 102 - r * Math.cos((a * Math.PI) / 180)];
    if (!this.static) {
      let lines = '';
      let bars = '';
      let dots = '';
      for (let m = 1; m < 60; m++) {
        const a = m * 6;
        if (m % 10 === 0) continue;
        if (m < 15) {
          const p1 = P(a, 53.5);
          const p2 = P(a, 57);
          lines += 'M' + f(p1[0]) + ' ' + f(p1[1]) + 'L' + f(p2[0]) + ' ' + f(p2[1]);
        } else if (m % 5 === 0) {
          const p1 = P(a, 50);
          const p2 = P(a, 56);
          bars += 'M' + f(p1[0]) + ' ' + f(p1[1]) + 'L' + f(p2[0]) + ' ' + f(p2[1]);
        } else {
          const p = P(a, 54.5);
          dots += 'M' + f(p[0] - 0.8) + ' ' + f(p[1]) + 'a0.8 0.8 0 1 0 1.6 0a0.8 0.8 0 1 0 -1.6 0Z';
        }
      }
      let markers = '';
      for (let h = 1; h <= 12; h++) {
        const a = h * 30;
        const c = P(a, 39);
        if (h === 12) {
          markers += 'M78 59L73.5 66L82.5 66Z';
        } else if (h % 3 === 0) {
          const p1 = P(a, 35);
          const p2 = P(a, 43);
          const perp = [Math.cos((a * Math.PI) / 180) * 2.5, Math.sin((a * Math.PI) / 180) * 2.5];
          markers += 'M' + f(p1[0] - perp[0]) + ' ' + f(p1[1] - perp[1]) + 'L' + f(p2[0] - perp[0]) + ' ' + f(p2[1] - perp[1]) + 'L' + f(p2[0] + perp[0]) + ' ' + f(p2[1] + perp[1]) + 'L' + f(p1[0] + perp[0]) + ' ' + f(p1[1] + perp[1]) + 'Z';
        } else {
          markers += 'M' + f(c[0] - 3.2) + ' ' + f(c[1]) + 'a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0Z';
        }
      }
      this.static = { lines: lines, bars: bars, dots: dots, markers: markers };
    }
    const s = now.getSeconds() + now.getMilliseconds() / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    let bez = 0;
    let elapsed = '0:00';
    if (demo) {
      const t0 = Math.floor(nowMs / 20000) * 20000;
      const d0 = new Date(t0);
      const target = (d0.getMinutes() + d0.getSeconds() / 60) * 6;
      if (this.t0 !== t0) {
        this.fromB = this.curB === undefined ? target : this.curB;
        this.t0 = t0;
      }
      const p = Math.min(1, (nowMs - t0) / 1200);
      const e = 1 - Math.pow(1 - p, 3);
      const delta = ((target - this.fromB + 540) % 360) - 180;
      bez = this.fromB + delta * e;
      this.curB = bez;
      const el = Math.floor((nowMs - t0) / 1000);
      elapsed = Math.floor(el / 60) + ':' + (el % 60 < 10 ? '0' : '') + (el % 60);
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      bezTf: 'rotate(' + f(bez) + ' 78 102)',
      bezLines: this.static.lines,
      bezBars: this.static.bars,
      bezDots: this.static.dots,
      markers: this.static.markers,
      hTf: 'rotate(' + f(h * 30) + ' 78 102)',
      mTf: 'rotate(' + f(m * 6) + ' 78 102)',
      sTf: 'rotate(' + f(s * 6) + ' 78 102)',
      elapsed: elapsed,
      depth: (18 + 4 * Math.sin(nowMs / 3000)).toFixed(1) + 'M'
    };
  }
}
</script>
</body>
</html>
