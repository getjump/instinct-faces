<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сезоны</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Сезоны»: дерево на холме меняется по временам года — снег, лепестки, летнее солнце, листопад; месяц и сезон в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="ss-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="ss-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="ss-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="ss-d75" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" width="1" height="1" fill="currentColor"></rect><rect y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="ss-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="ss-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="ss-d12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#ss-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<rect width="176" height="176" fill="{{skyFill}}"></rect>
<circle cx="30" cy="44" r="{{sunR}}" fill="currentColor"></circle>
<path d="{{rays}}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"></path>
<path d="M-2 140 Q88 112 178 140 V178 H-2 Z" fill="{{bg}}"></path>
<path d="M-2 140 Q88 112 178 140 V178 H-2 Z" fill="{{hillFill}}" stroke="currentColor" stroke-width="1"></path>
<polygon points="66,130 74,130 72,98 68,98" fill="currentColor"></polygon>
<path d="M70 104 L54 88 M70 100 L86 82 M70 98 L70 62 M70 90 L58 72 M70 88 L82 70 M54 88 L48 80 M86 82 L94 76" fill="none" stroke="currentColor" stroke-width="2"></path>
<g fill="{{canopyFill}}">
<circle cx="56" cy="84" r="18"></circle>
<circle cx="84" cy="84" r="18"></circle>
<circle cx="70" cy="66" r="22"></circle>
</g>
<path d="{{parts}}" fill="{{partFill}}"></path>
<rect x="104.5" y="76.5" width="64" height="40" fill="{{bg}}" stroke="currentColor" stroke-width="1"></rect>
<text x="108" y="102" fill="currentColor" font-family="'Jersey 10', monospace" font-size="30" textLength="54" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<text x="108" y="112" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<rect width="176" height="176" fill="url(#ss-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#ss-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="40" font-family="'Jersey 10', monospace" font-size="24">{{month}}</text>
<text x="144" y="54" font-family="Silkscreen, monospace" font-size="8">{{season}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#ss-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 120);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const bg = dark ? '#141512' : '#c6c9bc';
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    let s;
    if (demo) {
      s = Math.floor(t / 6) % 4;
    } else {
      const m = now.getMonth();
      s = (m === 11 || m < 2) ? 0 : (m < 5 ? 1 : (m < 8 ? 2 : 3));
    }
    const names = ['WINTER', 'SPRING', 'SUMMER', 'AUTUMN'];
    let parts = '';
    for (let i = 0; i < 26; i++) {
      let x;
      let y;
      let w;
      let h;
      if (s === 0) {
        const sp = 8 + (i % 4) * 3;
        y = (((i * 29) % 150) + sp * t) % 150;
        x = ((i * 41) % 170) + 3 + 3 * Math.sin(t * 0.9 + i);
        w = 2;
        h = 2;
      } else if (s === 1) {
        const sp = 7 + (i % 3) * 2;
        const fall = (((i * 13) % 84) + sp * t) % 84;
        y = 66 + fall;
        x = 36 + ((i * 23) % 68) + fall * 0.5 + 4 * Math.sin(t * 1.3 + i);
        w = 2;
        h = 1;
      } else if (s === 3) {
        const sp = 12 + (i % 4) * 3;
        const fall = (((i * 17) % 84) + sp * t) % 84;
        y = 66 + fall;
        x = 36 + ((i * 23) % 68) + 7 * Math.sin(t * 2 + i * 1.7);
        w = 3;
        h = 2;
      } else {
        continue;
      }
      parts += 'M' + Math.round(x) + ' ' + Math.round(y) + 'h' + w + 'v' + h + 'h' + (-w) + 'z';
    }
    let rays = '';
    if (s === 2) {
      for (let k = 0; k < 8; k++) {
        const a = t * 0.7 + (k * Math.PI) / 4;
        rays += 'M' + (30 + 10 * Math.cos(a)).toFixed(1) + ' ' + (44 + 10 * Math.sin(a)).toFixed(1) + 'L' + (30 + 13 * Math.cos(a)).toFixed(1) + ' ' + (44 + 13 * Math.sin(a)).toFixed(1);
      }
    }
    return {
      bg: bg,
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      skyFill: ['url(#ss-d50)', 'none', 'none', 'url(#ss-d12)'][s],
      hillFill: [bg, 'url(#ss-d25)', 'url(#ss-d50)', 'url(#ss-d75)'][s],
      canopyFill: ['none', 'url(#ss-d25)', 'currentColor', 'url(#ss-d50)'][s],
      partFill: s === 0 ? bg : 'currentColor',
      parts: parts || 'M0 0',
      sunR: s === 2 ? 7 : 0,
      rays: rays || 'M0 0',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      date: days[now.getDay()] + ' ' + p2(now.getDate()),
      month: demo ? ['JAN', 'APR', 'JUL', 'OCT'][s] : mons[now.getMonth()],
      season: names[s]
    };
  }
}
</script>
</body>
</html>
