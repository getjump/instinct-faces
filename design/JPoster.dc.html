<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Японский плакат</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Японский плакат»: модернистская вёрстка с огромными цифрами часов и минут и знаками 時 и 分, растровый круг медленно плывёт, вертикальная катакана с названием города, тонкие линейки сетки; минуты сменяются шторкой, секунды в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="pp-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="pp-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<clipPath id="pp-wipe"><rect x="0" y="100" width="176" height="{{wipeH}}"></rect></clipPath>
<pattern id="pp-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="pp-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#pp-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<circle cx="{{cx}}" cy="{{cy}}" r="28" fill="url(#pp-d50)"></circle>
<text x="30" y="38" fill="currentColor" font-family="'Dela Gothic One', sans-serif" font-size="8">TIME 時刻</text>
<path d="M18 94.5H150M128.5 56V160" fill="none" stroke="currentColor" stroke-width="1"></path>
<g fill="currentColor" font-family="'Dela Gothic One', sans-serif">
<text x="24" y="86" font-size="50" textLength="64" lengthAdjust="spacingAndGlyphs">{{hh}}</text>
<text x="92" y="86" font-size="14">時</text>
<g clip-path="url(#pp-wipe)">
<text x="24" y="146" font-size="50" textLength="64" lengthAdjust="spacingAndGlyphs">{{mm}}</text>
</g>
<text x="92" y="146" font-size="14">分</text>
</g>
<g fill="currentColor" font-family="'Dela Gothic One', sans-serif" font-size="12" text-anchor="middle">
<text x="142" y="80">タ</text>
<text x="142" y="94">シ</text>
<text x="142" y="108">ケ</text>
<text x="142" y="122">ン</text>
<text x="142" y="136">ト</text>
</g>
<text x="88" y="164" text-anchor="middle" fill="currentColor" font-family="'Dela Gothic One', sans-serif" font-size="8">{{date}}</text>
<rect width="176" height="176" fill="url(#pp-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#pp-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle" font-family="'Dela Gothic One', sans-serif">
<text x="144" y="42" font-size="22">{{ss}}</text>
<text x="144" y="56" font-size="8">ビョウ</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#pp-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const dayK = ['日', '月', '火', '水', '木', '金', '土'];
    const key = demo ? Math.floor(nowMs / 5000) : now.getHours() * 60 + now.getMinutes();
    if (this.key !== key) {
      this.key = key;
      this.wipeAt = nowMs;
    }
    const p = Math.min(1, (nowMs - this.wipeAt) / 450);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      cx: (96 + 4 * Math.cos(t * 0.8)).toFixed(1),
      cy: (82 + 4 * Math.sin(t * 0.8)).toFixed(1),
      wipeH: (60 * p).toFixed(1),
      hh: p2(now.getHours()),
      mm: p2(now.getMinutes()),
      date: now.getFullYear() + '.' + p2(now.getMonth() + 1) + '.' + p2(now.getDate()) + ' ' + dayK[now.getDay()],
      ss: p2(now.getSeconds())
    };
  }
}
</script>
</body>
</html>
