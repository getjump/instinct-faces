<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pong-часы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Pong-часы»: две ракетки сами играют мячом, счёт — часы и минуты, при смене минуты левая ракетка пропускает мяч, длина розыгрыша в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="pg-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="pg-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="pg-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#pg-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="30" y="56" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<rect x="0" y="67" width="176" height="2" fill="currentColor"></rect>
<rect x="0" y="147" width="176" height="2" fill="currentColor"></rect>
<path d="M88.5 70V146" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"></path>
<g fill="currentColor" font-family="'Jersey 10', monospace" font-size="30" text-anchor="middle" opacity="{{scoreOp}}">
<text x="66" y="100">{{hh}}</text>
<text x="111" y="100">{{mm}}</text>
</g>
<rect x="28" y="{{ly}}" width="3" height="16" fill="currentColor"></rect>
<rect x="145" y="{{ry}}" width="3" height="16" fill="currentColor"></rect>
<rect x="{{bx}}" y="{{by}}" width="3" height="3" fill="currentColor"></rect>
<text x="88" y="162" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{label}}</text>
<rect width="176" height="176" fill="url(#pg-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#pg-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">RALLY</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{rally}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">HITS</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#pg-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.step(), 40);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  ensure() {
    if (!this.b) {
      this.b = { x: 88, y: 108, vx: 2.4, vy: 1.3 };
      this.ly = 100;
      this.ry = 100;
      this.rally = 0;
      this.flash = 0;
    }
  }
  step() {
    this.ensure();
    const now = Date.now();
    const b = this.b;
    const demo = this.props.demo ?? true;
    const m = new Date(now).getMinutes();
    if (this.lastMin !== undefined && m !== this.lastMin) this.missL = true;
    this.lastMin = m;
    if (demo && now - (this.lastMissAt || now - 1) > 8000 && !this.missL && !this.missR) {
      this.lastMissAt = now;
      if (Math.random() < 0.5) this.missL = true;
      else this.missR = true;
    }
    if (!this.lastMissAt) this.lastMissAt = now;
    b.x += b.vx;
    b.y += b.vy;
    if (b.y < 70) {
      b.y = 70;
      b.vy = Math.abs(b.vy);
    }
    if (b.y > 143) {
      b.y = 143;
      b.vy = -Math.abs(b.vy);
    }
    const away = b.y < 108 ? 130 : 70;
    const trackL = this.missL && b.vx < 0 ? away : b.y - 6.5;
    const trackR = this.missR && b.vx > 0 ? away : b.y - 6.5;
    this.ly += Math.max(-2.4, Math.min(2.4, trackL - this.ly));
    this.ry += Math.max(-2.4, Math.min(2.4, trackR - this.ry));
    this.ly = Math.max(70, Math.min(130, this.ly));
    this.ry = Math.max(70, Math.min(130, this.ry));
    if (!this.missL && b.vx < 0 && b.x <= 31 && b.x >= 25 && b.y + 3 >= this.ly && b.y <= this.ly + 16) {
      b.vx = Math.abs(b.vx);
      b.vy += (b.y + 1.5 - (this.ly + 8)) * 0.12;
      this.rally++;
    }
    if (!this.missR && b.vx > 0 && b.x + 3 >= 145 && b.x + 3 <= 151 && b.y + 3 >= this.ry && b.y <= this.ry + 16) {
      b.vx = -Math.abs(b.vx);
      b.vy += (b.y + 1.5 - (this.ry + 8)) * 0.12;
      this.rally++;
    }
    b.vy = Math.max(-2.6, Math.min(2.6, b.vy));
    if (Math.abs(b.vy) < 0.5) b.vy = b.vy < 0 ? -0.5 : 0.5;
    if (b.x < 14 || b.x > 162) {
      this.missL = false;
      this.missR = false;
      this.flash = now;
      this.rally = 0;
      b.x = 87;
      b.y = 80 + Math.random() * 50;
      b.vx = (Math.random() < 0.5 ? -1 : 1) * 2.4;
      b.vy = (Math.random() - 0.5) * 2.6;
    }
    this.setState({ t: now });
  }
  renderVals() {
    this.ensure();
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const sinceFlash = nowMs - (this.flash || 0);
    const flashing = sinceFlash < 700;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      hh: p2(now.getHours()),
      mm: p2(now.getMinutes()),
      scoreOp: flashing && Math.floor(sinceFlash / 120) % 2 === 1 ? 0 : 1,
      ly: this.ly.toFixed(1),
      ry: this.ry.toFixed(1),
      bx: this.b.x.toFixed(1),
      by: this.b.y.toFixed(1),
      label: flashing ? 'POINT!' : 'HOURS  VS  MINUTES',
      rally: String(this.rally)
    };
  }
}
</script>
</body>
</html>
