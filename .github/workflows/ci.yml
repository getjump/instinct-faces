name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Ruff
        run: |
          uvx ruff@0.14.4 check --output-format=github .
          uvx ruff@0.14.4 format --check .
      - name: Face checks
        run: python tools/check.py
      - name: Unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q
      - name: MCP server smoke test
        run: python tests/mcp_smoke.py
      - name: Gallery build
        run: python tools/gallery.py --out "$RUNNER_TEMP/site"

  site:
    name: Site lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx --from actionlint-py actionlint -color
