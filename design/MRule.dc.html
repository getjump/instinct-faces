<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rule 30</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Rule 30»: одномерный клеточный автомат добавляет строку за строкой и прокручивается вверх, время на табличке, номер правила и поколение в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="ru-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="ru-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="ru-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#ru-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<path d="{{cells}}" fill="currentColor"></path>
<rect x="40.5" y="72.5" width="96" height="34" fill="{{bg}}" stroke="currentColor" stroke-width="1"></rect>
<text x="88.5" y="101" text-anchor="middle" fill="currentColor" font-family="'Jersey 10', monospace" font-size="32" textLength="72" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<rect width="176" height="176" fill="url(#ru-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#ru-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">RULE</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{rule}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{gen}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#ru-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"rule":{"editor":"enum","options":["30","90","110","184"],"default":"30","section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.step(), 120);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  ruleNum() {
    const r = parseInt(this.props.rule ?? '30', 10);
    return isNaN(r) ? 30 : r;
  }
  next(prev, rule) {
    const W = 88;
    const n = new Uint8Array(W);
    for (let i = 0; i < W; i++) {
      const l = prev[(i + W - 1) % W];
      const c = prev[i];
      const r = prev[(i + 1) % W];
      n[i] = (rule >> ((l << 2) | (c << 1) | r)) & 1;
    }
    return n;
  }
  init() {
    const rule = this.ruleNum();
    this.rule = rule;
    const first = new Uint8Array(88);
    first[44] = 1;
    if (rule === 184) {
      for (let i = 0; i < 88; i++) first[i] = Math.random() < 0.45 ? 1 : 0;
    }
    this.rows = [first];
    for (let k = 0; k < 87; k++) this.rows.push(this.next(this.rows[this.rows.length - 1], rule));
    this.gen = 87;
  }
  step() {
    if (!this.rows || this.rule !== this.ruleNum()) this.init();
    const nr = this.next(this.rows[this.rows.length - 1], this.rule);
    const m = new Date().getMinutes();
    if (this.lastMin !== undefined && m !== this.lastMin) nr[Math.floor(Math.random() * 88)] ^= 1;
    this.lastMin = m;
    this.rows.push(nr);
    if (this.rows.length > 88) this.rows.shift();
    this.gen++;
    this.setState({ gen: this.gen });
  }
  renderVals() {
    if (!this.rows || this.rule !== this.ruleNum()) this.init();
    const dark = (this.props.mode ?? 'light') === 'dark';
    const now = new Date();
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    let d = '';
    for (let ry = 0; ry < this.rows.length; ry++) {
      const row = this.rows[ry];
      const y = ry * 2;
      let x = 0;
      while (x < 88) {
        if (row[x]) {
          let e = x;
          while (e < 88 && row[e]) e++;
          d += 'M' + x * 2 + ' ' + y + 'h' + (e - x) * 2 + 'v2h' + -(e - x) * 2 + 'z';
          x = e;
        } else {
          x++;
        }
      }
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      cells: d || 'M0 0',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      rule: String(this.rule),
      gen: 'G' + (this.gen % 100000)
    };
  }
}
</script>
</body>
</html>
