<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сонар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Сонар»: луч обходит экран радара с растровым шлейфом, засечки уведомлений и событий вспыхивают и гаснут, пеленг луча в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="sr-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="sr-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="sr-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="sr-b50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="{{bg}}"></rect><rect x="1" y="1" width="1" height="1" fill="{{bg}}"></rect></pattern>
<pattern id="sr-b25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="{{bg}}"></rect></pattern>
<pattern id="sr-b12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="{{bg}}"></rect><rect x="2" y="2" width="1" height="1" fill="{{bg}}"></rect></pattern>
</defs>
<g clip-path="url(#sr-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="32" y="42" fill="currentColor" font-family="'Jersey 10', monospace" font-size="26" textLength="48" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<circle cx="82" cy="102" r="56" fill="currentColor"></circle>
<path d="{{s3}}" fill="url(#sr-b12)"></path>
<path d="{{s2}}" fill="url(#sr-b25)"></path>
<path d="{{s1}}" fill="url(#sr-b50)"></path>
<g fill="none" stroke="{{bg}}" stroke-width="1">
<circle cx="82" cy="102" r="14" stroke-dasharray="1 2"></circle>
<circle cx="82" cy="102" r="28" stroke-dasharray="1 2"></circle>
<circle cx="82" cy="102" r="42" stroke-dasharray="1 2"></circle>
<circle cx="82" cy="102" r="55.5"></circle>
<path d="M26 102H138M82 46V158" stroke-dasharray="1 3"></path>
</g>
<path d="{{sweep}}" fill="none" stroke="{{bg}}" stroke-width="1.5"></path>
<path d="{{blips}}" fill="{{bg}}"></path>
<g fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8">
<text x="106" y="78" opacity="{{l1}}">MSG</text>
<text x="111" y="140" text-anchor="end" opacity="{{l2}}">15:00</text>
</g>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8">
<text x="140" y="98">2 MSG</text>
<text x="140" y="110">1 CAL</text>
</g>
<text x="88" y="168" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<rect width="176" height="176" fill="url(#sr-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#sr-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">SCAN</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{brg}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">DEG</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#sr-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 70);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const f = (v) => v.toFixed(1);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const cx = 82;
    const cy = 102;
    const R = 56;
    const rad = Math.PI / 180;
    const P = (ang, r) => [cx + r * Math.sin(ang * rad), cy - r * Math.cos(ang * rad)];
    const a = ((nowMs / 1000) * 60) % 360;
    const sector = (a1, a2) => {
      const q1 = P(a1, R);
      const q2 = P(a2, R);
      return 'M' + cx + ' ' + cy + 'L' + f(q1[0]) + ' ' + f(q1[1]) + 'A' + R + ' ' + R + ' 0 0 1 ' + f(q2[0]) + ' ' + f(q2[1]) + 'Z';
    };
    const tip = P(a, R - 1);
    const blipsDef = [
      { a: 40, r: 30 },
      { a: 130, r: 44 },
      { a: 220, r: 20 },
      { a: 300, r: 48 }
    ];
    let blips = '';
    const dts = [];
    for (let i = 0; i < blipsDef.length; i++) {
      const b = blipsDef[i];
      const dt = (((a - b.a) % 360) + 360) % 360;
      dts.push(dt);
      let sz = 0;
      if (dt < 30) sz = 4;
      else if (dt < 90) sz = 3;
      else if (dt < 180) sz = 2;
      else if (dt < 260) sz = 1;
      if (sz > 0) {
        const q = P(b.a, b.r);
        blips += 'M' + f(q[0] - sz / 2) + ' ' + f(q[1] - sz / 2) + 'h' + sz + 'v' + sz + 'h' + (-sz) + 'z';
      }
    }
    const brg = Math.floor(a);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      s1: sector(a - 20, a),
      s2: sector(a - 50, a - 20),
      s3: sector(a - 100, a - 50),
      sweep: 'M' + cx + ' ' + cy + 'L' + f(tip[0]) + ' ' + f(tip[1]),
      blips: blips || 'M0 0',
      l1: dts[0] < 120 ? 1 : 0,
      l2: dts[1] < 120 ? 1 : 0,
      brg: (brg < 100 ? '0' : '') + (brg < 10 ? '0' : '') + brg
    };
  }
}
</script>
</body>
</html>
