<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>QR-время</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «QR-время»: настоящий QR-код версии 2 с текущим временем и датой пересобирается каждую минуту, рядом время цифрами и полоса секунд, секунды в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="qr-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="qr-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="qr-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#qr-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<path d="M22 54V44H32M103 44H113V54M113 125V135H103M32 135H22V125" fill="none" stroke="currentColor" stroke-width="2"></path>
<path d="{{qr}}" fill="currentColor"></path>
<g fill="currentColor">
<text x="116" y="100" font-family="'Jersey 10', monospace" font-size="24" textLength="46" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<text x="116" y="112" font-family="Silkscreen, monospace" font-size="8">{{dm}}</text>
<text x="116" y="124" font-family="Silkscreen, monospace" font-size="8">SCAN</text>
</g>
<rect x="24.5" y="140.5" width="86" height="4" fill="none" stroke="currentColor" stroke-width="1"></rect>
<rect x="25" y="141" width="{{bar}}" height="3" fill="currentColor"></rect>
<text x="88" y="158" text-anchor="middle" fill="currentColor" font-family="VT323, monospace" font-size="12">{{payload}}</text>
<rect width="176" height="176" fill="url(#qr-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#qr-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">SEC</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{ss}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">V2-L</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#qr-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 250);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  encode(text) {
    const size = 25;
    const mods = [];
    const fn = [];
    for (let y = 0; y < size; y++) {
      mods.push(new Array(size).fill(false));
      fn.push(new Array(size).fill(false));
    }
    const setF = (x, y, d) => {
      mods[y][x] = d;
      fn[y][x] = true;
    };
    for (let i = 0; i < size; i++) {
      setF(6, i, i % 2 === 0);
      setF(i, 6, i % 2 === 0);
    }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const x = cx + dx;
          const y = cy + dy;
          if (x < 0 || y < 0 || x >= size || y >= size) continue;
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          setF(x, y, dist !== 2 && dist !== 4);
        }
      }
    };
    finder(3, 3);
    finder(size - 4, 3);
    finder(3, size - 4);
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        setF(18 + dx, 18 + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
    const fdata = (1 << 3) | 0;
    let rem = fdata;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const bits = ((fdata << 10) | rem) ^ 0x5412;
    const gb = (v, i) => ((v >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) setF(8, i, gb(bits, i));
    setF(8, 7, gb(bits, 6));
    setF(8, 8, gb(bits, 7));
    setF(7, 8, gb(bits, 8));
    for (let i = 9; i < 15; i++) setF(14 - i, 8, gb(bits, i));
    for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, gb(bits, i));
    for (let i = 8; i < 15; i++) setF(8, size - 15 + i, gb(bits, i));
    setF(8, size - 8, true);
    const bb = [];
    const push = (val, len) => {
      for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1);
    };
    push(4, 4);
    push(text.length, 8);
    for (let i = 0; i < text.length; i++) push(text.charCodeAt(i) & 0xff, 8);
    const cap = 34 * 8;
    push(0, Math.min(4, cap - bb.length));
    push(0, (8 - (bb.length % 8)) % 8);
    for (let pad = 0xec; bb.length < cap; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bb.length; i += 8) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bb[i + j];
      data.push(v);
    }
    const mul = (x, y) => {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11d);
        z ^= ((y >>> i) & 1) * x;
      }
      return z;
    };
    const deg = 10;
    const div = new Array(deg).fill(0);
    div[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < div.length; j++) {
        div[j] = mul(div[j], root);
        if (j + 1 < div.length) div[j] ^= div[j + 1];
      }
      root = mul(root, 0x02);
    }
    const ecc = new Array(deg).fill(0);
    for (let k = 0; k < data.length; k++) {
      const factor = data[k] ^ ecc.shift();
      ecc.push(0);
      for (let i = 0; i < deg; i++) ecc[i] ^= mul(div[i], factor);
    }
    const all = data.concat(ecc);
    const tot = all.length * 8;
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!fn[y][x] && bi < tot) {
            mods[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0;
            bi++;
          }
        }
      }
    }
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (!fn[y][x] && (x + y) % 2 === 0) mods[y][x] = !mods[y][x];
      }
    }
    return mods;
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const now = new Date();
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const yy = String(now.getFullYear()).slice(2);
    const time = p2(now.getHours()) + ':' + p2(now.getMinutes());
    const payload = 'TIME ' + time + ' ' + p2(now.getDate()) + '.' + p2(now.getMonth() + 1) + '.' + yy;
    if (this.qrText !== payload) {
      this.qrText = payload;
      const mods = this.encode(payload);
      let d = '';
      for (let y = 0; y < 25; y++) {
        for (let x = 0; x < 25; x++) {
          if (mods[y][x]) d += 'M' + (30 + x * 3) + ' ' + (52 + y * 3) + 'h3v3h-3z';
        }
      }
      this.qrPath = d;
    }
    const s = now.getSeconds();
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      qr: this.qrPath,
      time: time,
      dm: p2(now.getDate()) + '.' + p2(now.getMonth() + 1),
      bar: ((85 * s) / 59).toFixed(1),
      payload: payload,
      ss: p2(s)
    };
  }
}
</script>
</body>
</html>
