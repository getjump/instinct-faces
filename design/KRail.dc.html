<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Железнодорожные</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Железнодорожные»: карманный циферблат с крупными антиквенными цифрами, двойным кантом и минутной дорожкой, стрелка часов с лопаткой, малая секундная на шести тикает пять раз в секунду">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="rl-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="rl-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="rl-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#rl-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="24" y="36" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">21 JEWELS</text>
<circle cx="78" cy="102" r="57.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
<circle cx="78" cy="102" r="54" fill="none" stroke="currentColor" stroke-width="1"></circle>
<path d="{{ticks}}" fill="none" stroke="currentColor" stroke-width="0.8"></path>
<path d="{{dots}}" fill="currentColor"></path>
<g fill="currentColor" font-family="'Playfair Display', serif" font-weight="700" font-size="15" text-anchor="middle">
<text x="97.5" y="73.2">1</text><text x="111.8" y="87.5">2</text><text x="117" y="107">3</text>
<text x="111.8" y="126.5">4</text><text x="97.5" y="140.8">5</text>
<text x="58.5" y="140.8">7</text><text x="44.2" y="126.5">8</text><text x="39" y="107">9</text>
<text x="44.2" y="87.5">10</text><text x="58.5" y="73.2">11</text><text x="78" y="68">12</text>
</g>
<circle cx="78" cy="128" r="11" fill="{{bg}}" stroke="currentColor" stroke-width="1"></circle>
<path d="{{subTicks}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<g transform="{{ssTf}}">
<rect x="77.5" y="119" width="1" height="12" fill="currentColor"></rect>
</g>
<circle cx="78" cy="128" r="1.5" fill="currentColor"></circle>
<g transform="{{hTf}}">
<path d="M76.8 104 L76.8 84 A4.5 4.5 0 1 1 79.2 84 L79.2 104 Z M76.5 76.5 L78 70 L79.5 76.5 Z" fill="currentColor"></path>
<circle cx="78" cy="79.8" r="1.6" fill="{{bg}}"></circle>
</g>
<g transform="{{mTf}}">
<path d="M77.2 106 L77.2 56 L78 49 L78.8 56 L78.8 106 Z" fill="currentColor"></path>
</g>
<circle cx="78" cy="102" r="2.5" fill="currentColor"></circle>
<rect width="176" height="176" fill="url(#rl-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#rl-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">{{dow}}</text>
<text x="144" y="44" font-family="'Playfair Display', serif" font-weight="700" font-size="22">{{dd}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{mon}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#rl-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 100);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const now = new Date();
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const f = (v) => v.toFixed(1);
    if (!this.paths) {
      let ticks = '';
      let dots = '';
      let sub = '';
      for (let i = 0; i < 60; i++) {
        const a = (i * 6 * Math.PI) / 180;
        if (i % 5 === 0) {
          const x = 78 + 51 * Math.sin(a);
          const y = 102 - 51 * Math.cos(a);
          dots += 'M' + f(x - 1.4) + ' ' + f(y) + 'a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0Z';
        } else {
          ticks += 'M' + f(78 + 49.5 * Math.sin(a)) + ' ' + f(102 - 49.5 * Math.cos(a)) + 'L' + f(78 + 53 * Math.sin(a)) + ' ' + f(102 - 53 * Math.cos(a));
        }
      }
      for (let i = 0; i < 12; i++) {
        const a = (i * 30 * Math.PI) / 180;
        sub += 'M' + f(78 + 8 * Math.sin(a)) + ' ' + f(128 - 8 * Math.cos(a)) + 'L' + f(78 + 10.5 * Math.sin(a)) + ' ' + f(128 - 10.5 * Math.cos(a));
      }
      this.paths = [ticks, dots, sub];
    }
    const sec = now.getSeconds() + now.getMilliseconds() / 1000;
    const tick = Math.floor(sec * 5) / 5;
    const m = now.getMinutes() + sec / 60;
    const h = (now.getHours() % 12) + m / 60;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      ticks: this.paths[0],
      dots: this.paths[1],
      subTicks: this.paths[2],
      ssTf: 'rotate(' + f(tick * 6) + ' 78 128)',
      hTf: 'rotate(' + f(h * 30) + ' 78 102)',
      mTf: 'rotate(' + f(m * 6) + ' 78 102)',
      dow: days[now.getDay()],
      dd: p2(now.getDate()),
      mon: mons[now.getMonth()]
    };
  }
}
</script>
</body>
</html>
