<body>
<x-dc>

<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Калькулятор»: окошко ЖК с семисегментными цифрами и клавиатура 4 на 4; клавиши сами нажимаются, считая долю шагов, минуты до полуночи и минуты в сутках, затем снова показывается время">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="cl-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="cl-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="cl-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="cl-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#cl-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="26" y="40" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">SOLAR CALC</text>
<rect x="24.5" y="46.5" width="86" height="28" rx="2" fill="{{bg}}" stroke="currentColor" stroke-width="1.5"></rect>
<path d="{{ghost}}" fill="url(#cl-d25)"></path>
<path d="{{lit}}" fill="currentColor"></path>
<g fill="currentColor" opacity="{{colon}}">
<rect x="79" y="57" width="2" height="2"></rect>
<rect x="79" y="64" width="2" height="2"></rect>
</g>
<g fill="none" stroke="currentColor" stroke-width="1">
<rect x="31.5" y="84.5" width="23" height="12" rx="2"></rect><rect x="61.5" y="84.5" width="23" height="12" rx="2"></rect><rect x="91.5" y="84.5" width="23" height="12" rx="2"></rect><rect x="121.5" y="84.5" width="23" height="12" rx="2"></rect>
<rect x="31.5" y="101.5" width="23" height="12" rx="2"></rect><rect x="61.5" y="101.5" width="23" height="12" rx="2"></rect><rect x="91.5" y="101.5" width="23" height="12" rx="2"></rect><rect x="121.5" y="101.5" width="23" height="12" rx="2"></rect>
<rect x="31.5" y="118.5" width="23" height="12" rx="2"></rect><rect x="61.5" y="118.5" width="23" height="12" rx="2"></rect><rect x="91.5" y="118.5" width="23" height="12" rx="2"></rect><rect x="121.5" y="118.5" width="23" height="12" rx="2"></rect>
<rect x="31.5" y="135.5" width="23" height="12" rx="2"></rect><rect x="61.5" y="135.5" width="23" height="12" rx="2"></rect><rect x="91.5" y="135.5" width="23" height="12" rx="2"></rect><rect x="121.5" y="135.5" width="23" height="12" rx="2"></rect>
</g>
<g fill="currentColor" font-family="Silkscreen, monospace" font-size="8" text-anchor="middle">
<text x="43" y="94">7</text><text x="73" y="94">8</text><text x="103" y="94">9</text><text x="133" y="94">/</text>
<text x="43" y="111">4</text><text x="73" y="111">5</text><text x="103" y="111">6</text><text x="133" y="111">X</text>
<text x="43" y="128">1</text><text x="73" y="128">2</text><text x="103" y="128">3</text><text x="133" y="128">-</text>
<text x="43" y="145">0</text><text x="73" y="145">.</text><text x="103" y="145">=</text><text x="133" y="145">+</text>
</g>
<rect x="{{px}}" y="{{py}}" width="24" height="13" rx="2" fill="currentColor" opacity="{{pop}}"></rect>
<text x="{{plx}}" y="{{ply}}" text-anchor="middle" fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8" opacity="{{pop}}">{{plabel}}</text>
<rect width="176" height="176" fill="url(#cl-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#cl-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">{{state}}</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{dd}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{dow}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#cl-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 60);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  seg7(x, top, W, H, T, ch) {
    const f = (v) => v.toFixed(1);
    const map = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };
    const on = map[ch] === undefined ? '' : map[ch];
    const g = T * 0.6;
    const h2 = H / 2;
    const t = T / 2;
    const hz = (x0, y0, L) => 'M' + f(x0) + ' ' + f(y0) + 'L' + f(x0 + t) + ' ' + f(y0 - t) + 'L' + f(x0 + L - t) + ' ' + f(y0 - t) + 'L' + f(x0 + L) + ' ' + f(y0) + 'L' + f(x0 + L - t) + ' ' + f(y0 + t) + 'L' + f(x0 + t) + ' ' + f(y0 + t) + 'Z';
    const vt = (x0, y0, L) => 'M' + f(x0) + ' ' + f(y0) + 'L' + f(x0 + t) + ' ' + f(y0 + t) + 'L' + f(x0 + t) + ' ' + f(y0 + L - t) + 'L' + f(x0) + ' ' + f(y0 + L) + 'L' + f(x0 - t) + ' ' + f(y0 + L - t) + 'L' + f(x0 - t) + ' ' + f(y0 + t) + 'Z';
    const segs = {
      a: hz(x + g, top, W - 2 * g),
      g: hz(x + g, top + h2, W - 2 * g),
      d: hz(x + g, top + H, W - 2 * g),
      f: vt(x, top + g, h2 - 2 * g),
      e: vt(x, top + h2 + g, h2 - 2 * g),
      b: vt(x + W, top + g, h2 - 2 * g),
      c: vt(x + W, top + h2 + g, h2 - 2 * g)
    };
    let onP = '';
    let offP = '';
    const keys = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
    for (let i = 0; i < keys.length; i++) {
      if (on.indexOf(keys[i]) >= 0) onP += segs[keys[i]];
      else offP += segs[keys[i]];
    }
    return [onP, offP];
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mod = now.getHours() * 60 + now.getMinutes();
    const modDigits = String(mod).split('');
    const seqs = [
      { keys: ['8', '4', '1', '2', '/', '1', '0', '0', '0', '0', '='], result: '0.8412' },
      { keys: ['1', '4', '4', '0', '-'].concat(modDigits, ['=']), result: String(1440 - mod) },
      { keys: ['2', '4', 'X', '6', '0', '='], result: '1440' }
    ];
    const CYCLE = 9000;
    const seq = seqs[Math.floor(nowMs / CYCLE) % seqs.length];
    const phase = nowMs % CYCLE;
    const STEP = 330;
    const keysEnd = seq.keys.length * STEP;
    let disp = '';
    let timeMode = false;
    let pressed = null;
    if (phase < keysEnd + 1800) {
      const k = Math.min(seq.keys.length - 1, Math.floor(phase / STEP));
      let cur = '0';
      let fresh = true;
      for (let i = 0; i <= k; i++) {
        const key = seq.keys[i];
        if (key >= '0' && key <= '9') {
          cur = fresh ? key : cur + key;
          fresh = false;
        } else if (key === '=') {
          cur = seq.result;
        } else {
          fresh = true;
        }
      }
      disp = cur;
      if (phase - k * STEP < 200 && phase < keysEnd) pressed = seq.keys[k];
    } else {
      timeMode = true;
      disp = p2(now.getHours()) + p2(now.getMinutes());
    }
    const cells = [];
    for (let i = 0; i < disp.length; i++) {
      const ch = disp[i];
      if (ch === '.') {
        if (cells.length === 0) cells.push({ ch: '0', dp: true });
        else cells[cells.length - 1].dp = true;
      } else {
        cells.push({ ch: ch, dp: false });
      }
    }
    const shown = cells.slice(-6);
    while (shown.length < 6) shown.unshift({ ch: ' ', dp: false });
    let lit = '';
    let ghost = '';
    for (let i = 0; i < 6; i++) {
      const x = 30 + 13 * i;
      const r = this.seg7(x, 52, 9, 18, 2.5, shown[i].ch);
      lit += r[0];
      ghost += r[1];
      if (shown[i].dp) lit += 'M' + (x + 10.5) + ' 69h2v2h-2z';
    }
    const layout = [['7', '8', '9', '/'], ['4', '5', '6', 'X'], ['1', '2', '3', '-'], ['0', '.', '=', '+']];
    let px = 0;
    let py = 0;
    let pop = 0;
    let plabel = '';
    if (pressed) {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (layout[r][c] === pressed) {
            px = 31 + c * 30;
            py = 84 + r * 17;
            pop = 1;
            plabel = pressed;
          }
        }
      }
    }
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      lit: lit || 'M0 0',
      ghost: ghost || 'M0 0',
      colon: timeMode && now.getSeconds() % 2 === 0 ? 1 : 0,
      px: px,
      py: py,
      pop: pop,
      plx: px + 12,
      ply: py + 10,
      plabel: plabel,
      state: timeMode ? 'TIME' : 'CALC',
      dd: p2(now.getDate()),
      dow: days[now.getDay()]
    };
  }
}
</script>
</body>
</html>
