<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Змейка от шагов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Змейка»: змейка сама ползёт к яблокам на поле, её базовая длина зависит от шагов за день, счёт съеденных яблок в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="nk-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="nk-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="nk-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="nk-dots" x="26" y="70" width="6" height="6" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="1" height="1" fill="currentColor"></rect></pattern>
</defs>
<g clip-path="url(#nk-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<text x="28" y="60" fill="currentColor" font-family="'Jersey 10', monospace" font-size="28" textLength="56" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<rect x="26" y="70" width="126" height="78" fill="url(#nk-dots)"></rect>
<rect x="24.5" y="68.5" width="129" height="81" fill="none" stroke="currentColor" stroke-width="1"></rect>
<path d="{{apple}}" fill="currentColor"></path>
<path d="{{body}}" fill="currentColor"></path>
<rect x="{{ex}}" y="{{ey}}" width="1" height="1" fill="{{bg}}"></rect>
<text x="88" y="162" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{info}}</text>
<rect width="176" height="176" fill="url(#nk-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#nk-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">APPLES</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{eaten}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">TODAY</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#nk-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.step(), 110);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  freeCell() {
    for (let k = 0; k < 200; k++) {
      const c = Math.floor(Math.random() * 21);
      const r = Math.floor(Math.random() * 13);
      let hit = false;
      for (let i = 0; i < this.snake.length; i++) {
        if (this.snake[i][0] === c && this.snake[i][1] === r) {
          hit = true;
          break;
        }
      }
      if (!hit) return [c, r];
    }
    return [0, 0];
  }
  reset() {
    const L = 3 + Math.floor(8412 / 1000);
    this.base = L;
    this.snake = [];
    for (let i = 0; i < L; i++) this.snake.push([(10 - i + 21) % 21, 6]);
    this.dir = [1, 0];
    this.apple = this.freeCell();
    if (this.eaten === undefined) this.eaten = 0;
  }
  step() {
    if (!this.snake) this.reset();
    const head = this.snake[0];
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const occ = {};
    for (let i = 0; i < this.snake.length - 1; i++) occ[this.snake[i][0] + ',' + this.snake[i][1]] = true;
    let best = null;
    let bestD = 1e9;
    for (let k = 0; k < 4; k++) {
      const d = dirs[k];
      if (d[0] === -this.dir[0] && d[1] === -this.dir[1]) continue;
      const nx = (head[0] + d[0] + 21) % 21;
      const ny = (head[1] + d[1] + 13) % 13;
      if (occ[nx + ',' + ny]) continue;
      let dx = Math.abs(nx - this.apple[0]);
      dx = Math.min(dx, 21 - dx);
      let dy = Math.abs(ny - this.apple[1]);
      dy = Math.min(dy, 13 - dy);
      const dist = dx + dy + Math.random() * 0.3;
      if (dist < bestD) {
        bestD = dist;
        best = d;
      }
    }
    if (!best) {
      this.reset();
      this.setState({ t: Date.now() });
      return;
    }
    this.dir = best;
    const nh = [(head[0] + best[0] + 21) % 21, (head[1] + best[1] + 13) % 13];
    this.snake.unshift(nh);
    if (nh[0] === this.apple[0] && nh[1] === this.apple[1]) {
      this.eaten++;
      if (this.snake.length > 40) this.snake = this.snake.slice(0, this.base);
      this.apple = this.freeCell();
    } else {
      this.snake.pop();
    }
    this.setState({ t: Date.now() });
  }
  renderVals() {
    if (!this.snake) this.reset();
    const dark = (this.props.mode ?? 'light') === 'dark';
    const now = new Date();
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    let body = '';
    for (let i = 0; i < this.snake.length; i++) {
      const x = 26 + this.snake[i][0] * 6;
      const y = 70 + this.snake[i][1] * 6;
      body += 'M' + x + ' ' + y + 'h5v5h-5z';
    }
    const ax = 26 + this.apple[0] * 6;
    const ay = 70 + this.apple[1] * 6;
    const apple = 'M' + (ax + 2.5) + ' ' + ay + 'l2.5 2.5l-2.5 2.5l-2.5 -2.5z';
    const hx = 26 + this.snake[0][0] * 6;
    const hy = 70 + this.snake[0][1] * 6;
    const ex = hx + 2 + this.dir[0] * 1.5;
    const ey = hy + 2 + this.dir[1] * 1.5;
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      body: body,
      apple: apple,
      ex: Math.round(ex),
      ey: Math.round(ey),
      info: 'LEN ' + this.snake.length + ' / 8.4K',
      eaten: String(this.eaten)
    };
  }
}
</script>
</body>
</html>
