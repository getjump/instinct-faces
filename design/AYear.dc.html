<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Год в точках</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Год в точках»: каждый день года — точка, прошедшие залиты, сегодняшний мигает, номер дня и процент года в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="yr-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="yr-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="yr-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
</defs>
<g clip-path="url(#yr-main)">
<rect width="176" height="176" fill="{{bg}}"></rect>
<path d="{{past}}" fill="currentColor"></path>
<path d="{{future}}" fill="currentColor"></path>
<path d="{{today}}" fill="currentColor" opacity="{{blink}}"></path>
<path d="{{todayRing}}" fill="none" stroke="currentColor" stroke-width="1"></path>
<text x="88" y="160" text-anchor="middle" fill="currentColor" font-family="'Jersey 10', monospace" font-size="26" textLength="52" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<text x="88" y="170" text-anchor="middle" fill="currentColor" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<rect width="176" height="176" fill="url(#yr-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#yr-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">DAY</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="26">{{doy}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{pct}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#yr-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 80);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const t = nowMs / 1000;
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    if (!this.pos) {
      const pos = [];
      for (let y = 8; y <= 134; y += 6) {
        for (let x = 6; x <= 168; x += 6) {
          const dm = Math.hypot(x + 2 - 88, y + 2 - 88);
          const dr = Math.hypot(x + 2 - 144, y + 2 - 32);
          if (dm < 84 && dr > 39) pos.push([x, y]);
        }
      }
      this.pos = pos;
    }
    const year = now.getFullYear();
    const leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    const total = leap ? 366 : 365;
    const doyReal = Math.floor((now - new Date(year, 0, 1)) / 86400000) + 1;
    const doy = demo ? Math.min(total, (Math.floor(t / 0.08) % (total + 40)) + 1) : doyReal;
    let past = '';
    let future = '';
    let today = 'M0 0';
    let ring = 'M0 0';
    const n = Math.min(total, this.pos.length);
    for (let i = 0; i < n; i++) {
      const x = this.pos[i][0];
      const y = this.pos[i][1];
      if (i + 1 < doy) {
        past += 'M' + x + ' ' + y + 'h4v4h-4z';
      } else if (i + 1 === doy) {
        today = 'M' + x + ' ' + y + 'h4v4h-4z';
        ring = 'M' + (x - 1.5) + ' ' + (y - 1.5) + 'h7v7h-7z';
      } else {
        future += 'M' + (x + 1.5) + ' ' + (y + 1.5) + 'h1v1h-1z';
      }
    }
    const shown = new Date(year, 0, doy);
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      past: past || 'M0 0',
      future: future || 'M0 0',
      today: today,
      todayRing: ring,
      blink: Math.floor(t * 2) % 2 === 0 ? 1 : 0,
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      date: mons[shown.getMonth()] + ' ' + p2(shown.getDate()) + ' ' + year,
      doy: String(doy),
      pct: Math.round((doy / total) * 100) + '%'
    };
  }
}
</script>
</body>
</html>
