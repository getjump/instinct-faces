<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Огромная луна</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#555}a:hover{color:#222}
</style>
</helmet>
<div style="width: 480px; height: 560px; background: #e4e2dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 240 280" width="480" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Циферблат «Огромная луна»: растровая луна с морями и кратерами во весь экран, терминатор движется по реальной фазе, пепельный свет на тёмной стороне, фаза и возраст луны в окошке">
<rect x="66" y="0" width="108" height="280" rx="12" fill="#1c1d1a"></rect>
<rect x="84" y="10" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="20" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="256" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="84" y="266" width="72" height="4" rx="2" fill="#2a2b27"></rect>
<rect x="6" y="82" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="131" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="6" y="180" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="100" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<rect x="222" y="162" width="12" height="18" rx="3" fill="{{caseColor}}" stroke="#000" stroke-opacity="0.3"></rect>
<polygon points="52,36 188,36 226,74 226,206 188,244 52,244 14,206 14,74" fill="{{caseColor}}"></polygon>
<polygon points="56,44 184,44 218,78 218,202 184,236 56,236 22,202 22,78" fill="#000" fill-opacity="0.2"></polygon>
<circle cx="120" cy="140" r="97" fill="#111210"></circle>
<circle cx="176" cy="84" r="38" fill="#111210"></circle>
<svg x="32" y="52" width="176" height="176" viewBox="0 0 176 176" style="color: {{ink}}">
<defs>
<clipPath id="mn-main"><circle cx="88" cy="88" r="88"></circle></clipPath>
<clipPath id="mn-sub"><circle cx="144" cy="32" r="31"></circle></clipPath>
<pattern id="mn-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="currentColor" stroke-width="0.12" stroke-opacity="0.09"></path></pattern>
<pattern id="mn-d50" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect><rect x="1" y="1" width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="mn-d25" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"></rect></pattern>
<pattern id="mn-b12" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="{{bg}}"></rect><rect x="2" y="2" width="1" height="1" fill="{{bg}}"></rect></pattern>
</defs>
<g clip-path="url(#mn-main)">
<rect width="176" height="176" fill="currentColor"></rect>
<g fill="{{bg}}">
<rect x="150" y="120" width="1" height="1"></rect>
<rect x="160" y="96" width="1" height="1"></rect>
<rect x="146" y="146" width="1" height="1"></rect>
<rect x="128" y="160" width="1" height="1"></rect>
<rect x="20" y="120" width="1" height="1"></rect>
<rect x="36" y="150" width="1" height="1"></rect>
<rect x="154" y="74" width="1" height="1"></rect>
<rect x="16" y="90" width="1" height="1"></rect>
<rect x="112" y="166" width="1" height="1"></rect>
<rect x="157" y="133" width="2" height="1"></rect>
<rect x="158" y="132" width="1" height="3"></rect>
</g>
<text x="30" y="42" fill="{{bg}}" font-family="'Jersey 10', monospace" font-size="26" textLength="48" lengthAdjust="spacingAndGlyphs">{{time}}</text>
<circle cx="82" cy="100" r="56" fill="{{bg}}"></circle>
<g fill="url(#mn-d50)">
<ellipse cx="66" cy="92" rx="16" ry="12"></ellipse>
<ellipse cx="98" cy="112" rx="12" ry="9"></ellipse>
<ellipse cx="90" cy="80" rx="9" ry="7"></ellipse>
</g>
<g fill="url(#mn-d25)" stroke="currentColor" stroke-width="1">
<circle cx="62" cy="126" r="7"></circle>
<circle cx="108" cy="76" r="5"></circle>
<circle cx="74" cy="66" r="4"></circle>
<circle cx="104" cy="134" r="6"></circle>
<circle cx="50" cy="104" r="5"></circle>
</g>
<path d="{{shadow}}" fill="currentColor"></path>
<path d="{{shadow}}" fill="url(#mn-b12)"></path>
<text x="88" y="168" text-anchor="middle" fill="{{bg}}" font-family="Silkscreen, monospace" font-size="8">{{date}}</text>
<rect width="176" height="176" fill="url(#mn-grid)"></rect>
</g>
<circle cx="144" cy="32" r="34.5" fill="#111210"></circle>
<g clip-path="url(#mn-sub)">
<rect x="113" y="1" width="62" height="62" fill="{{bg}}"></rect>
<g fill="currentColor" text-anchor="middle">
<text x="144" y="20" font-family="Silkscreen, monospace" font-size="8">{{phase}}</text>
<text x="144" y="44" font-family="'Jersey 10', monospace" font-size="24">{{illum}}</text>
<text x="144" y="56" font-family="Silkscreen, monospace" font-size="8">{{age}}</text>
</g>
<rect x="113" y="1" width="62" height="62" fill="url(#mn-grid)"></rect>
</g>
</svg>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"Экран"},"caseColor":{"editor":"color","options":["#2b2d29","#56603f","#b5472b","#cfc9ba"],"default":"#2b2d29","section":"Корпус"},"demo":{"editor":"boolean","default":true,"section":"Анимация"},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ t: Date.now() }), 100);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const demo = this.props.demo ?? true;
    const nowMs = Date.now();
    const now = new Date(nowMs);
    const p2 = (v) => (v < 10 ? '0' : '') + v;
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const SYN = 29.530588853;
    let age;
    if (demo) {
      age = ((nowMs / 1000) * 2) % SYN;
    } else {
      const ref = Date.UTC(2000, 0, 6, 18, 14);
      age = ((nowMs - ref) / 86400000) % SYN;
      if (age < 0) age += SYN;
    }
    const th = (2 * Math.PI * age) / SYN;
    const c = Math.cos(th);
    const k = Math.abs(56 * c).toFixed(2);
    const waxing = age < SYN / 2;
    let shadow;
    if (waxing) {
      shadow = 'M82 44 A56 56 0 0 0 82 156 A' + k + ' 56 0 0 ' + (c > 0 ? 0 : 1) + ' 82 44 Z';
    } else {
      shadow = 'M82 44 A56 56 0 0 1 82 156 A' + k + ' 56 0 0 ' + (c > 0 ? 1 : 0) + ' 82 44 Z';
    }
    const illum = Math.round(((1 - c) / 2) * 100);
    let phase = 'NEW';
    if (age >= 1.85 && age < 5.54) phase = 'CRESC';
    else if (age >= 5.54 && age < 9.23) phase = '1ST Q';
    else if (age >= 9.23 && age < 12.92) phase = 'GIBB';
    else if (age >= 12.92 && age < 16.61) phase = 'FULL';
    else if (age >= 16.61 && age < 20.3) phase = 'GIBB';
    else if (age >= 20.3 && age < 23.99) phase = '3RD Q';
    else if (age >= 23.99 && age < 27.68) phase = 'CRESC';
    return {
      bg: dark ? '#141512' : '#c6c9bc',
      ink: dark ? '#d7dacd' : '#161713',
      caseColor: this.props.caseColor ?? '#2b2d29',
      time: p2(now.getHours()) + ':' + p2(now.getMinutes()),
      date: days[now.getDay()] + ' ' + p2(now.getDate()) + ' ' + mons[now.getMonth()],
      shadow: shadow,
      phase: phase,
      illum: illum + '%',
      age: Math.floor(age) + 'D'
    };
  }
}
</script>
</body>
</html>
